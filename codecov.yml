codecov:
  notify:
    # One upload per unit that reports coverage; raise it as units are added
    after_n_builds: 16

# Mark uncovered changed lines inline in the PR diff
github_checks:
  annotations: true

coverage:
  status:
    # Overall coverage may not drop below the base commit's. The frontend is
    # reported but never blocks: it tests what matters rather than every line
    project:
      default:
        target: auto
        threshold: 0%
        paths:
          - "!platform/frontend/"
      frontend:
        target: auto
        informational: true
        flags:
          - frontend
    # Every new or changed line must be covered, except in the frontend, whose
    # uncovered lines are shown on the PR without failing it
    patch:
      default:
        target: 100%
        threshold: 0%
        paths:
          - "!platform/frontend/"
      frontend:
        target: 100%
        informational: true
        flags:
          - frontend

flags:
  sdk:
    paths:
      - sdk/prometheus_api/
  backend:
    paths:
      - platform/backend/app/
  frontend:
    paths:
      - platform/frontend/src/
  client-agent:
    paths:
      - platform/agents/client-agent/
  osti-research-agent:
    paths:
      - platform/agents/optional/osti-research-agent/
  code-render-debug-agent:
    paths:
      - platform/agents/debug-agents/code-render-debug-agent/
  corrosion-agent:
    paths:
      - platform/agents/debug-agents/corrosion-agent/
  thermal-agent:
    paths:
      - platform/agents/debug-agents/thermal-agent/
  form-filler-agent:
    paths:
      - platform/agents/form-filler-agent/
  synthesis-agent:
    paths:
      - platform/agents/synthesis-agent/
  artifact-debug-agent:
    paths:
      - platform/agents/debug-agents/artifact-debug-agent/
  material-data-agent:
    paths:
      - platform/agents/debug-agents/material-data-agent/
  radiation-agent:
    paths:
      - platform/agents/debug-agents/radiation-agent/
  thread-pattern-agent:
    paths:
      - platform/agents/debug-agents/thread-pattern-agent/
  agent-template:
    paths:
      - agent-template/setup_agent.py
  template-agent:
    paths:
      - agent-template/agent_template/
  # Uploaded only by the path-filtered platformctl workflow, so it is not counted in
  # after_n_builds above, and its last result carries forward to commits that don't run it
  platformctl:
    paths:
      - platform/ctl/platformctl/
    carryforward: true
