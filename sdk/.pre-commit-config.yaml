default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: uv run mypy prometheus_api/
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: unit-tests
        name: unit tests
        entry: uv run pytest tests/unit -m "not integration" --cov
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: requirement-tests
        name: requirement tests
        entry: make test-requirements
        language: system
        pass_filenames: false
        stages: [pre-push]
