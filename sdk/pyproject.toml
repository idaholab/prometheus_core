[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-api"
version = "0.15.0"
description = "Storage client and agent utilities for building A2A multi-agent systems"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "INL Genesis", email = "daniel.schwen@inl.gov"}
]
keywords = ["storage", "deeplynx", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "a2a-sdk[http-server]>=1.0.0,<2",
    "fsspec>=2026.2.0",
    "httpx>=0.26.0",
    "litellm[mcp]>=1.80,<2",
    "pydantic>=2.0.0",
    "protobuf>=5.29.5,<7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "PyJWT[crypto]>=2.8.0",
    "redis>=5.0.0",
    "starlette>=0.35.0",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=4.6.0",
    "types-protobuf>=6.30.2",
    "types-pyyaml>=6.0.12",
    "prometheus-speccheck",
]

[tool.uv.sources]
prometheus-speccheck = { path = "../common/speccheck" }

[project.urls]
Homepage = "https://github.com/idaholab/prometheus_core/tree/devel/sdk"
Repository = "https://github.com/idaholab/prometheus_core"
Documentation = "https://github.com/idaholab/prometheus_core/blob/devel/sdk/README.md"

[project.entry-points."fsspec.specs"]
deeplynx = "prometheus_api.storage_client.filesystem:DeepLynxFileSystem"

[project.scripts]
prometheus-identity-keygen = "prometheus_api.agent.identity_keygen:main"

[tool.setuptools]
packages = [
    "prometheus_api",
    "prometheus_api.llm_client",
    "prometheus_api.llm_configs",
    "prometheus_api.storage_client",
    "prometheus_api.storage_client.models",
    "prometheus_api.storage_client.resources",
    "prometheus_api.storage_client.async_resources",
    "prometheus_api.storage_client.utils",
    "prometheus_api.agent",
    "prometheus_api.credentials",
]

[tool.setuptools.package-data]
"prometheus_api.llm_configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests requiring .env file and database connection",
    "slow: Slow running tests",
]
# Collection checks every covers(ID, how) claim against specs/ (see [tool.speccheck]). CI sets
# SPECCHECK_PRODUCER for each job, which wins over this default
speccheck_config = "pyproject.toml"
speccheck_producer = "sdk-python"

# speccheck: a requirement in specs/ is met only when a test that claims it with
# @pytest.mark.covers(ID, how) ran and passed in CI. See ../common/speccheck/README.md
[tool.speccheck]
specs = "specs"
# The IDs move to the SDK- prefix in their own commit (common/speccheck/plan/03-sdk-adopt.md)
id-prefix = ""

# pytest in the sdk-python job, every leg (test.yml)
[tool.speccheck.producers.sdk-python]
workflows = ["test"]

# pytest inside the image in the sdk-docker job, every leg (test.yml)
[tool.speccheck.producers.sdk-docker]
workflows = ["test"]

[tool.speccheck.report]
title = "sdk requirements"

[tool.coverage.run]
source_pkgs = ["prometheus_api"]
relative_files = true
omit = ["tests/*"]

[tool.coverage.report]
# The lowest total across the supported Python versions; never lower it
fail_under = 69.7
precision = 2

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["examples"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["examples"]

[[tool.mypy.overrides]]
module = [
    "fsspec",
    "fsspec.*",
    "redis",
]
ignore_missing_imports = true
