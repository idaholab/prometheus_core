# INL LiteLLM proxy inference scaffold.
# Replace model IDs and the shared endpoint for the target INL LiteLLM deployment.

model_list:
  - model_name: default
    litellm_params:
      model: openai/claude-sonnet-5-5-awsgov
      api_key: os.environ/LLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: small
    litellm_params:
      model: openai/claude-haiku-5-5-awsgov
      api_key: os.environ/LLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: medium
    litellm_params:
      model: openai/claude-sonnet-5-5-awsgov
      api_key: os.environ/LLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: large
    litellm_params:
      model: openai/claude-opus-5-5-awsgov
      api_key: os.environ/LLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: vision
    litellm_params:
      model: openai/claude-opus-5-5-awsgov
      api_key: os.environ/LLM_API_KEY
      api_base: https://litellm.inl.gov/v1

  - model_name: embedding
    litellm_params:
      model: openai/text-embedding-3-large-gov-va
      api_key: os.environ/LLM_API_KEY
      api_base: https://litellm.inl.gov/v1
