{{- /*
Production frontend: nginx serves the built app on 8080. With frontend.dev, the
image runs the Vite dev server on 5150 instead (HMR for make cluster-dev). The
Service stays on 8080 either way, so the ingress doesn't change.
*/ -}}
{{- if .Values.frontend.enabled }}
{{- $ctx := dict "root" . "name" "frontend" -}}
{{- $dev := .Values.frontend.dev -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "prometheus.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "prometheus.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prometheus.labels" $ctx | nindent 8 }}
    spec:
      {{- include "prometheus.pullSecrets" . | trim | nindent 6 }}
      {{- include "prometheus.podSecurity" . | trim | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "prometheus.image" (dict "root" . "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ ternary 5150 8080 $dev }}
          env:
            # The server still proxies /api/ for clients that bypass the ingress
            # (kubectl port-forward svc/frontend)
            {{- if $dev }}
            - name: VITE_BACKEND_URL
              value: http://backend:8000
            {{- else }}
            - name: BACKEND_UPSTREAM
              value: http://backend:8000
            {{- end }}
          {{- /* Vite has no /healthz; it serves the app at / once it is up */}}
          {{- include "prometheus.probes" (dict "path" (ternary "/" "/healthz" $dev) "port" "http" "startupSeconds" (ternary 180 60 $dev)) | trim | nindent 10 }}
          {{- include "prometheus.containerSecurity" . | trim | nindent 10 }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "prometheus.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "prometheus.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
