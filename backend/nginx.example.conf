# Example nginx config for serving the React SPA alongside the backend API.
#
# This is reference documentation: it shows how to serve the built SPA at / and
# proxy the JSON/SSE API to the backend service. The production config actually
# used by the build lives at frontend/nginx/default.conf.template (frontend/Dockerfile
# prod stage).
#
# The one non-obvious part is /api/events: it is a long-lived Server-Sent Events
# stream, so nginx must not buffer or time it out the way it would a normal
# request. Keep that location block above the generic /api/ block.

server {
    listen 8080;
    server_name _;

    # --- React single-page app ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # --- Server-Sent Events: GET /api/events (must precede the generic /api/) ---
    location = /api/events {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';       # keep the connection open for SSE
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;                  # flush events immediately
        proxy_cache off;
        proxy_read_timeout 3600s;             # long-lived stream
    }

    # --- JSON API ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
