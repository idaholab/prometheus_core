# speccheck's own config: its specs, and what may prove them. See README.md, "Config".

specs = "specs"
id-prefix = "SPC"
require-index = true

# tests/requirements, every leg of the `requirements` job in speccheck.yml. The unit tests
# (tests/unit) claim nothing: they are for coverage and for finding a broken module fast
[producers.speccheck-requirements]
specs = "all"
workflows = ["speccheck"]

# The `speccheck-self-check` job in speccheck.yml. It runs speccheck-verify on the requirements legs'
# results (which installs speccheck with speccheck-install), checks that speccheck-upload refuses an
# empty folder, then records with the installed `speccheck` and uploads with speccheck-upload.
# `record` is its last step before the upload, so it runs only when all of that passed
[ci.speccheck-self-check]
covers = ["SPC-REQ-007-03", "SPC-REQ-007-04", "SPC-REQ-007-05", "SPC-REQ-007-07"]
workflows = ["speccheck"]

[report]
title = "speccheck requirements"
