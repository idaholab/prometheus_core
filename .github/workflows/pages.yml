name: pages

on:
  push:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: "build"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Build docs
        working-directory: platform/docs
        run: uv run --frozen zensical build --clean
      - name: Build hackathon slides
        working-directory: hackathon/slides
        run: make build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble site
        # The docs are the site root and the slides are served from /hackathon/
        run: |
          cp -R platform/docs/site _site
          mkdir _site/hackathon
          cd hackathon/slides
          cp -R ./*.html assets ../../_site/hackathon/
          mkdir ../../_site/hackathon/one-day
          cp one-day/*.html ../../_site/hackathon/one-day/
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: "deploy"
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
