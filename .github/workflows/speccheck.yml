name: speccheck

# The spec checker (common/speccheck) and its composite actions, checked by speccheck itself.
# On every supported Python, `unit` runs tests/unit under coverage (combined and held at 100% by
# `coverage`), and `requirements` runs tests/requirements and uploads their results.
# `speccheck-self-check` runs the composite actions and `record` for real. The final `speccheck`
# job verifies speccheck's own specs (common/speccheck/specs) from this run's results and
# publishes the report. Runs
# only when those paths change, and is not a required check. See common/speccheck/plan/

on:
  push:
    branches: [devel]
    paths:
      - "common/speccheck/**"
      - ".github/actions/speccheck-install/**"
      - ".github/actions/speccheck-upload/**"
      - ".github/actions/speccheck-verify/**"
      - ".github/workflows/speccheck.yml"
  pull_request:
    branches: [main, devel]
    paths:
      - "common/speccheck/**"
      - ".github/actions/speccheck-install/**"
      - ".github/actions/speccheck-upload/**"
      - ".github/actions/speccheck-verify/**"
      - ".github/workflows/speccheck.yml"
  # No merge_group trigger: this isn't a required check, so a merge-queue run would be advisory and
  # cost the whole workflow (about 13 jobs) for every entry. Add it back when the check is required

permissions:
  # actions: read lets speccheck-verify look up this run's job names, to name each result's job
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # tests/unit: one module at a time, under coverage. These tests claim nothing; the coverage
    # job combines every leg and enforces 100%
    name: "speccheck: unit python ${{ matrix.python }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: common/speccheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
          # Nothing here is worth caching, and a cache is one more thing to trust
          enable-cache: false
      - name: Sync environment
        run: uv sync --locked
      - name: Ruff
        if: ${{ matrix.python == '3.14' }}
        run: |
          uv run --locked --no-sync ruff check --output-format=github .
          uv run --locked --no-sync ruff format --check --diff .
      - name: Unit tests
        # coverage starts before pytest loads speccheck's own plugin, so its import-time lines
        # count. Each leg writes its own data; the coverage job combines them, so a line only one
        # Python version runs (the tomli import) still counts
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python }}
        run: uv run --locked --no-sync python -I -m coverage run -m pytest --color=yes tests/unit
      - name: Code base rules
        # tests/rules: docstrings, headers and the test layout. The same on every Python and not
        # measured, so one leg is enough
        if: ${{ matrix.python == '3.14' }}
        run: uv run --locked --no-sync pytest --color=yes tests/rules
      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speccheck-coverage-${{ matrix.python }}
          path: common/speccheck/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  requirements:
    # tests/requirements: speccheck's own specs, proven through what a user sees. Not run under
    # coverage. The results file each leg writes is this producer's evidence
    name: "speccheck: requirements python ${{ matrix.python }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: common/speccheck
    env:
      SPECCHECK_PRODUCER: speccheck-requirements
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Sync environment
        run: uv sync --locked
      - name: Requirements tests
        env:
          # The `job` context is only available to steps, not to a job's own `env`
          SPECCHECK_JOB_ID: ${{ job.check_run_id }}
        run: >-
          uv run --locked --no-sync pytest --color=yes tests/requirements
          --speccheck-results=.speccheck/requirements-${{ matrix.python }}.jsonl
      - name: Upload speccheck results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/speccheck-upload
        with:
          name: requirements-${{ matrix.python }}
          path: common/speccheck/.speccheck

  coverage:
    name: "speccheck: coverage"
    needs: unit
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: common/speccheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.14"
          enable-cache: false
      - name: Sync environment
        run: uv sync --locked
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: speccheck-coverage-*
          path: common/speccheck
          merge-multiple: true
      - name: Combine and enforce 100% line and branch coverage
        # fail_under = 100 is in pyproject.toml
        run: |
          uv run --locked --no-sync coverage combine
          uv run --locked --no-sync coverage report

  speccheck-self-check:
    # The job's id is the [ci.speccheck-self-check] entry's name: `record` finds its claims by
    # $GITHUB_JOB, so renaming the job makes verify --complete report the producer as missing.
    # The composite actions and `record`, run for real. This job is the evidence for the
    # requirements in [ci.speccheck-self-check] (common/speccheck/speccheck.toml), and records
    # them only when every step before the record step passed
    name: "speccheck: self-check"
    needs: requirements
    # Runs even when a requirements leg failed, so the final job doesn't also report this job as a
    # missing producer on top of the real failure. When a leg's failure reaches the results its
    # first speccheck-verify fails, so `record` doesn't run and its requirements stay unproven;
    # otherwise its checks of the actions stand on their own
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 007-04 verify the requirements results
        id: verify
        # The requirements legs' results alone are complete for speccheck-requirements; the
        # self-check job itself hasn't reported yet, so this is a partial check
        uses: ./.github/actions/speccheck-verify
        with:
          config: common/speccheck/speccheck.toml
          report-name: speccheck-report-self-check
      - name: 007-04 check the report and summary
        # $GITHUB_STEP_SUMMARY is a new file in each step, so check the one the action wrote
        env:
          SUMMARY: ${{ steps.verify.outputs.summary-path }}
          ARTIFACT_ID: ${{ steps.verify.outputs.report-artifact-id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/speccheck-report"
          workflow=.github/workflows/speccheck.yml
          test -s "$report/report.md"
          # report.json: the same requirements, every result named by a requirements job's display name
          python3 -I -c 'import json, sys; body = json.load(open(sys.argv[1])); assert body["command"] == "report" and body["requirements"], body; names = {e["job_name"] for r in body["requirements"] for e in r["evidence"]}; assert names and all(n.startswith("speccheck: requirements python ") for n in names), names' \
            "$report/report.json"
          test -n "$SUMMARY" || { echo "speccheck-verify gave no summary-path" >&2; exit 1; }
          # One line of counts linking the report artifact uploaded in this run, and nothing else on a pass
          grep -qE '^\*\*speccheck:\*\* .*Full report: \[speccheck-report\]\(https://github\.com/.+/actions/runs/[0-9]+/artifacts/[0-9]+\)$' "$SUMMARY" \
            || { echo "no summary line linking the report in $SUMMARY" >&2; cat "$SUMMARY" >&2; exit 1; }
          if grep -q '^- ' "$SUMMARY"; then echo "a passing verify listed problems in $SUMMARY" >&2; exit 1; fi
          # The link is to the artifact this action uploaded, by the ID it output, and the run has it
          linked=$(sed -nE 's#^.*Full report: \[speccheck-report\]\(https://github\.com/.+/actions/runs/[0-9]+/artifacts/([0-9]+)\)$#\1#p' "$SUMMARY")
          test -n "$ARTIFACT_ID" && test "$linked" = "$ARTIFACT_ID" \
            || { echo "the summary links artifact '$linked', not the uploaded report '$ARTIFACT_ID'" >&2; exit 1; }
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id) \(.name)"' | grep -qx "$ARTIFACT_ID speccheck-report-self-check" \
            || { echo "the run has no artifact $ARTIFACT_ID named speccheck-report-self-check" >&2; exit 1; }
          # The job names were looked up: a result is named by its job's display name, linked to the job,
          # and every leg of the requirements matrix was read, not only one
          for python in $(yq '.jobs.requirements.strategy.matrix.python[]' "$workflow"); do
            grep -qE "^- ✅ passed in \[speccheck: requirements python $python\]\(https://github\.com/.+/job/[0-9]+\)$" \
              "$report/report.md" \
              || { echo "the report has no result from 'speccheck: requirements python $python', named by its display name" >&2; exit 1; }
          done
      - name: 007-04 verify with the default report name
        # The final job publishes `speccheck-report` too and replaces this one (the upload sets
        # overwrite), so the default name is exercised here and the final job's report is kept
        id: default-report
        uses: ./.github/actions/speccheck-verify
        with:
          config: common/speccheck/speccheck.toml
      - name: 007-04 check the default report
        env:
          ARTIFACT_ID: ${{ steps.default-report.outputs.report-artifact-id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$ARTIFACT_ID" || { echo "speccheck-verify uploaded no report artifact" >&2; exit 1; }
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id) \(.name)"' | grep -qx "$ARTIFACT_ID speccheck-report" \
            || { echo "the run has no artifact $ARTIFACT_ID named speccheck-report" >&2; exit 1; }
      - name: 007-04 add an unreadable results file
        # download-artifact adds to this folder, so the next speccheck-verify reads this file too
        run: echo 'not json' > "$RUNNER_TEMP/speccheck-results/bad.jsonl"
      - name: 007-04 verify fails on it
        id: failing-verify
        continue-on-error: true
        uses: ./.github/actions/speccheck-verify
        with:
          config: common/speccheck/speccheck.toml
          report-name: speccheck-report-self-check-failing
      - name: 007-04 check it still published its report
        env:
          OUTCOME: ${{ steps.failing-verify.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test "$OUTCOME" = failure || { echo "speccheck-verify was $OUTCOME on a bad results file" >&2; exit 1; }
          test -s "$RUNNER_TEMP/speccheck-report/report.md"
          # Not only a local file: the run has the artifact, so the upload step ran after the failure
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' | grep -qx 'speccheck-report-self-check-failing' \
            || { echo "the failed verify uploaded no report artifact" >&2; exit 1; }
          rm "$RUNNER_TEMP/speccheck-results/bad.jsonl"
      - name: 007-09 verify without job names
        # SPC-REQ-007-09: a lookup that fails warns and goes on. Run 1 isn't in this repository,
        # so the lookup fails the way a missing `actions: read` would
        id: no-names
        uses: ./.github/actions/speccheck-verify
        with:
          config: common/speccheck/speccheck.toml
          report-name: speccheck-report-self-check-no-names
          job-names-run-id: "1"
      - name: 007-09 check results use producer names
        env:
          OUTCOME: ${{ steps.no-names.outcome }}
        run: |
          test "$OUTCOME" = success || { echo "speccheck-verify was $OUTCOME when the names lookup failed" >&2; exit 1; }
          test ! -e "$RUNNER_TEMP/speccheck-job-names.json"
          report="$RUNNER_TEMP/speccheck-report/report.md"
          grep -qE '^- ✅ passed in \[speccheck-requirements\]\(https://github\.com/.+/job/[0-9]+\)$' "$report" \
            || { echo "the report doesn't fall back to the producer's name" >&2; exit 1; }
          # Every result, not just one: none is named by a display name, and none by anything but its producer
          if grep -q 'requirements python' "$report"; then echo "a result is still named by a display name" >&2; exit 1; fi
          test "$(grep -cE '^- [^ ]+ [a-z]+ in ' "$report")" = "$(grep -cE '^- [^ ]+ [a-z]+ in \[speccheck-requirements\]' "$report")" \
            || { echo "a result is named by something other than its producer" >&2; grep -E '^- [^ ]+ [a-z]+ in ' "$report" >&2; exit 1; }
      - name: 007-08 check permissions and secrets
        # SPC-REQ-007-08: the workflow grants actions: read and contents: read and nothing else,
        # no job widens it, and neither the workflow nor the actions it runs name a secret
        run: |
          workflow=.github/workflows/speccheck.yml
          # Parsed, not grepped: the top-level permissions are exactly these two, and no job has its own
          test "$(yq -o=json -I=0 '.permissions' "$workflow")" = '{"actions":"read","contents":"read"}'
          test "$(yq '[.jobs[] | select(has("permissions"))] | length' "$workflow")" = 0
          # Any use of the secrets context, however it is written: secrets.X, secrets['X'],
          # toJSON(secrets), `secrets: inherit`. Comment lines are skipped. The pattern's `[s]` keeps
          # this step from matching itself, and the files are listed first so an empty glob fails
          # here instead of making grep exit 2 and the `if` pass
          files=(.github/actions/speccheck-*/action.yml)
          test "${#files[@]}" -ge 3 && test -f "${files[0]}"
          if grep -nE 'secret[s]' "$workflow" "${files[@]}" | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "speccheck.yml or a speccheck action names a secret" >&2
            exit 1
          fi
      - name: 007-03 make an empty folder
        run: mkdir "$RUNNER_TEMP/empty-results"
      - name: 007-03 upload the empty folder
        id: empty-upload
        continue-on-error: true
        uses: ./.github/actions/speccheck-upload
        with:
          name: must-not-exist
          path: ${{ runner.temp }}/empty-results
      - name: 007-03 check the empty upload failed
        env:
          OUTCOME: ${{ steps.empty-upload.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test "$OUTCOME" = failure || { echo "speccheck-upload was $OUTCOME on an empty folder" >&2; exit 1; }
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' > "$RUNNER_TEMP/artifact-names"
          if grep -qx 'speccheck-results-must-not-exist' "$RUNNER_TEMP/artifact-names"; then
            echo "the empty upload left an artifact behind" >&2
            exit 1
          fi
      - name: 007-03 make a throwaway file
        # The run keeps this artifact (deleting it would need `actions: write`), and the final job
        # downloads every speccheck-results-* artifact. speccheck reads only *.jsonl, so the file
        # isn't one
        run: |
          mkdir "$RUNNER_TEMP/throwaway"
          echo 'not a results file' > "$RUNNER_TEMP/throwaway/x.txt"
      - name: 007-03 upload it as x
        uses: ./.github/actions/speccheck-upload
        with:
          name: x
          path: ${{ runner.temp }}/throwaway
      - name: 007-03 check the artifact name
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' | grep -qx 'speccheck-results-x' \
            || { echo "no artifact speccheck-results-x: the action ignored its name input" >&2; exit 1; }
      - name: 007-06 install speccheck
        uses: ./.github/actions/speccheck-install
      - name: 005-09 verify on an empty folder fails
        # No results read means nothing is proven, even without --complete (SPC-REQ-005-09)
        run: |
          mkdir "$RUNNER_TEMP/no-results"
          if speccheck verify --config common/speccheck/speccheck.toml "$RUNNER_TEMP/no-results"; then
            echo "speccheck verify passed with no results files" >&2
            exit 1
          fi
      - name: 007-01 record the job's evidence
        env:
          # The `job` context is only available to steps, not to a job's own `env`
          SPECCHECK_JOB_ID: ${{ job.check_run_id }}
        run: speccheck record --config common/speccheck/speccheck.toml --output .speccheck/self-check.jsonl
      - name: 007-03 upload this job's results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/speccheck-upload
        with:
          name: self-check
          path: .speccheck

  speccheck:
    # The final job, the same as every workflow that proves requirements will have. It runs even
    # when a job above failed, so the report shows what was proven, and fails if anything isn't
    name: "speccheck: verify specs"
    needs: [requirements, speccheck-self-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify
        uses: ./.github/actions/speccheck-verify
        with:
          config: common/speccheck/speccheck.toml
          # speccheck's own producers all run on every event of this workflow
          complete: "true"
