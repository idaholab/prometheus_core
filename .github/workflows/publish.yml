name: publish-images
# The tag isn't known until the meta job runs, so the title names the test run
# that triggered this one and the tag goes in the job names
run-name: >-
  ${{ github.event.workflow_run.display_title
  && format('Publish images: {0}', github.event.workflow_run.display_title)
  || format('Publish images {0}', github.ref_name) }}

# Publishes the devel images to ghcr.io after the test workflow passes on a
# push to devel. Tags are <commit date>-<7 char sha>, e.g. 20261014-ea90a3d.
# The -devel suffix keeps these separate from future release images.

on:
  # zizmor: ignore[dangerous-triggers] Only acts on successful push runs of
  # test on devel (see meta's if), and builds that already-merged commit, never
  # PR code. It gets no artifacts or other input from the triggering run
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  meta:
    name: "meta"
    # workflow_run also fires for failed runs and for PRs from devel
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/devel' ||
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-slim
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
      suffix: ${{ steps.meta.outputs.suffix }}
      agents: ${{ steps.agents.outputs.agents }}
      agent-names: ${{ steps.agents.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit that was tested, not the current tip of devel
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Compute tag
        id: meta
        run: |
          sha=$(git rev-parse HEAD)
          # Commit date in UTC, so the tag doesn't depend on the runner or a rebuild
          date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d HEAD)
          tag="$date-${sha:0:7}"
          # ghcr.io/idaholab/prometheus_core upstream; a fork publishes to its
          # own namespace. ghcr.io requires lowercase names
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "prefix=$prefix"
            echo "suffix=-devel"
          } >> "$GITHUB_OUTPUT"
      - name: List agents
        id: agents
        # Every agent the platform starts by default or with DEBUG_AGENTS=true,
        # as {name, context}. The name is the compose service, the first one in
        # the agent's docker-compose.yml, which docker-compose.agents.build-cache.yml
        # (platform/Makefile) names the cache after. The optional agents aren't
        # published: no CI job starts them, and their ML dependencies would
        # make a large cache
        run: |
          entries=('{"name":"client-agent","context":"platform/agents/client-agent"}')
          names=(client-agent)
          for f in platform/agents/*/docker-compose.yml platform/agents/debug-agents/*/docker-compose.yml; do
            name=$(sed -n '/^services:/{n;s/^  \([A-Za-z0-9_.-]*\):.*/\1/p;q;}' "$f")
            if [ -z "$name" ]; then
              echo "::error file=$f::No service found"
              exit 1
            fi
            entries+=("{\"name\":\"$name\",\"context\":\"$(dirname "$f")\"}")
            names+=("$name")
          done
          agents=$(IFS=,; echo "[${entries[*]}]")
          echo "$agents"
          {
            echo "agents=$agents"
            echo "names=${names[*]}"
          } >> "$GITHUB_OUTPUT"

  sdk:
    name: "sdk ${{ needs.meta.outputs.tag }}"
    needs: meta
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      prefix: ${{ needs.meta.outputs.prefix }}
      name: sdk
      suffix: ${{ needs.meta.outputs.suffix }}
      tag: ${{ needs.meta.outputs.tag }}
      sha: ${{ needs.meta.outputs.sha }}
      context: sdk
      file: sdk/Dockerfile
      build-contexts: certs=common/certs

  agents:
    name: "${{ matrix.agent.name }} ${{ needs.meta.outputs.tag }}"
    needs: meta
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.meta.outputs.agents) }}
    uses: ./.github/workflows/build-image.yml
    with:
      prefix: ${{ needs.meta.outputs.prefix }}
      name: ${{ matrix.agent.name }}
      suffix: ${{ needs.meta.outputs.suffix }}
      tag: ${{ needs.meta.outputs.tag }}
      sha: ${{ needs.meta.outputs.sha }}
      context: ${{ matrix.agent.context }}
      file: ${{ matrix.agent.context }}/Dockerfile
      # Same sdk/certs contexts as the agents' docker-compose.yml: they
      # install prometheus_api from sdk/, like the backend, rather than
      # building FROM the sdk image
      build-contexts: |
        sdk=sdk
        certs=common/certs

  backend:
    name: "backend ${{ needs.meta.outputs.tag }}"
    needs: meta
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      prefix: ${{ needs.meta.outputs.prefix }}
      name: backend
      suffix: ${{ needs.meta.outputs.suffix }}
      tag: ${{ needs.meta.outputs.tag }}
      sha: ${{ needs.meta.outputs.sha }}
      # Same context and sdk/certs contexts as docker-compose.yml
      context: platform/backend
      file: platform/backend/Dockerfile
      build-contexts: |
        sdk=sdk
        certs=common/certs

  frontend:
    name: "frontend ${{ needs.meta.outputs.tag }}"
    needs: meta
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      prefix: ${{ needs.meta.outputs.prefix }}
      name: frontend
      suffix: ${{ needs.meta.outputs.suffix }}
      tag: ${{ needs.meta.outputs.tag }}
      sha: ${{ needs.meta.outputs.sha }}
      # Same context, target, and certs context as docker-compose.yml
      context: platform
      file: platform/frontend/Dockerfile
      target: prod
      build-contexts: certs=common/certs

  summary:
    name: "summary"
    # Also report which images failed, as long as there was a tag to publish
    if: ${{ always() && needs.meta.result == 'success' }}
    needs: [meta, sdk, agents, backend, frontend]
    runs-on: ubuntu-slim
    steps:
      - name: Write summary
        env:
          PREFIX: ${{ needs.meta.outputs.prefix }}
          SUFFIX: ${{ needs.meta.outputs.suffix }}
          TAG: ${{ needs.meta.outputs.tag }}
          AGENT_NAMES: ${{ needs.meta.outputs.agent-names }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SDK_RESULT: ${{ needs.sdk.result }}
          AGENTS_RESULT: ${{ needs.agents.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          status() {
            case "$1" in
              success) echo "✅ published" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "⚪ cancelled" ;;
              *) echo "❌ $1" ;;
            esac
          }
          # Packages are linked to the repo by the image's source annotation, and
          # the package name is the image path after the owner, slash encoded
          repo_name="${PREFIX#ghcr.io/*/}"
          row() {
            local image="$PREFIX/prometheus_$1$SUFFIX:$TAG"
            local package_url="$REPO_URL/pkgs/container/$repo_name%2Fprometheus_$1$SUFFIX"
            echo "| $1 | [\`$image\`]($package_url) | $(status "$2") |"
          }
          {
            echo "## Published images \`$TAG\`"
            echo
            echo "| Image | Reference | Status |"
            echo "|---|---|---|"
            row sdk "$SDK_RESULT"
            row backend "$BACKEND_RESULT"
            row frontend "$FRONTEND_RESULT"
            # A matrix has one result for all of its jobs; the job list shows
            # which agent failed
            for name in $AGENT_NAMES; do
              row "$name" "$AGENTS_RESULT"
            done
          } >> "$GITHUB_STEP_SUMMARY"
