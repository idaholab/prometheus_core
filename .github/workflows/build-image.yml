name: build-image

# Builds one image for amd64 and arm64, pushes each by digest, and merges the
# digests into a single multi-arch tag. Called by publish.yml once per image.

on:
  workflow_call:
    inputs:
      prefix:
        description: Registry path the packages go under, e.g. ghcr.io/owner/repo
        required: true
        type: string
      name:
        description: Short name, unique within the run (keys the digest artifacts). The image is prometheus_<name><suffix>
        required: true
        type: string
      suffix:
        description: Appended to the image name, e.g. -devel
        required: false
        type: string
        default: ""
      tag:
        required: true
        type: string
      sha:
        description: Commit to build
        required: true
        type: string
      context:
        required: true
        type: string
      file:
        required: true
        type: string
      target:
        required: false
        type: string
        default: ""
      build-contexts:
        required: false
        type: string
        default: ""
      build-args:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ${{ inputs.prefix }}/prometheus_${{ inputs.name }}${{ inputs.suffix }}
  # Build cache for the PR builds in test.yml, which only read it. One tag per
  # platform. Only this workflow, never PR code, writes it
  CACHE: ${{ inputs.prefix }}/buildcache-prometheus_${{ inputs.name }}${{ inputs.suffix }}

jobs:
  build:
    name: "build ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      # A failed platform shouldn't cancel the other one, which still writes
      # its build cache for the next run. The merge job needs both to run
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          build-contexts: ${{ inputs.build-contexts }}
          build-args: ${{ inputs.build-args }}
          platforms: linux/${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          # The tag is applied in the merge job, once both platforms exist
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.CACHE }}:${{ matrix.platform }}
          cache-to: type=registry,ref=${{ env.CACHE }}:${{ matrix.platform }},mode=max,image-manifest=true,oci-mediatypes=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ inputs.name }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "merge"
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ inputs.name }}-*
          merge-multiple: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tag
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ inputs.sha }}
        run: |
          # The files are named by digest, without the sha256: prefix
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected 2 digests (amd64, arm64), found ${#digests[@]}"
            exit 1
          fi
          # The index annotation is what links the ghcr.io package to this repo
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.revision=$SHA" \
            "${digests[@]/#/$IMAGE@sha256:}"
      - name: Inspect
        env:
          TAG: ${{ inputs.tag }}
        run: docker buildx imagetools inspect "$IMAGE:$TAG"
