name: test

on:
  push:
    branches: [devel]
  pull_request:
    branches: [main, devel]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  # Registry build cache that publish-images writes on devel (build-image.yml),
  # read-only here. One package per image, one tag per platform. The packages
  # are public, so the docker build jobs need no login
  BUILD_CACHE: ghcr.io/${{ github.repository }}/buildcache-prometheus

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: "gitleaks"
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trust workspace
        # The checkout isn't owned by the container user, and without this git
        # refuses to read it and gitleaks passes without scanning anything
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Scan
        # Only the commits being added: the PR's commits, the merge group's, or
        # the pushed ones. Each event sets only its own base, the others are empty
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # gitleaks passes without scanning if the range is empty or the base
          # commit is missing, so check the range with git first
          count=$(git rev-list --count "$BASE_SHA..$HEAD_SHA")
          if [ "$count" -eq 0 ]; then
            echo "::error::No commits to scan in $BASE_SHA..$HEAD_SHA"
            exit 1
          fi
          gitleaks git --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA" .

  ruff:
    name: "ruff"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Check
        # Every project is checked even if an earlier one fails; the step fails
        # at the end if any did. Each project uses its own locked ruff version
        # from just the dev group
        run: |
          # <project>[:<uv project, relative to it>]. platform/scripts isn't a
          # uv project, so it's linted with platform/tests' locked ruff
          projects=(
            sdk
            platform/backend
            platform/tests
            platform/scripts:../tests
            platform/agents
            agent-template
          )
          failed=()
          for entry in "${projects[@]}"; do
            project="${entry%%:*}"
            uv_project="."
            if [[ "$entry" == *:* ]]; then uv_project="${entry#*:}"; fi

            echo "::group::ruff $project"
            if ! (
              set -e
              cd "$project"
              export UV_PROJECT="$uv_project"
              uv sync --frozen --only-dev
              rc=0
              uv run --frozen --no-sync ruff check --output-format=github . || rc=1
              uv run --frozen --no-sync ruff format --check --diff . || rc=1
              exit "$rc"
            ); then
              failed+=("$project")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::ruff failed in: ${failed[*]}"
            exit 1
          fi

  markings:
    name: "markings"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check
        run: python3 platform/scripts/add_markings.py --check

  uv-lock:
    # uv lock --check in every directory with a tracked uv.lock, so a
    # pyproject.toml change can't land without re-locking. New uv projects are
    # found by their uv.lock; npm ci covers the frontend's package-lock.json
    name: "uv lock"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Check
        # Checks every project before failing, so one run lists them all
        run: |
          mapfile -t locks < <(git ls-files -- 'uv.lock' '*/uv.lock')
          [ "${#locks[@]}" -gt 0 ] || { echo "::error::No uv.lock files found"; exit 1; }
          failed=0
          for lock in "${locks[@]}"; do
            dir="$(dirname "$lock")"
            echo "::group::$dir"
            if ! uv lock --check --directory "$dir"; then
              echo "::error file=$lock::$lock is out of date with $dir/pyproject.toml. Run 'uv lock' in $dir and commit the result."
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  image-pins:
    # Every Dockerfile FROM and compose image: is pinned by digest, so a tag
    # can't silently move. Dependabot keeps the tag and digest current
    name: "image pins"
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check
        run: python3 platform/scripts/check_image_pins.py

  hadolint-shellcheck:
    # hadolint on every Dockerfile and shellcheck on every shell script, found
    # by name or shebang. Config is in .hadolint.yaml
    name: "hadolint + shellcheck"
    runs-on: ubuntu-26.04
    env:
      # Syntax-highlighting fixtures for the code-render agent, not real files
      EXCLUDE: ":(exclude)platform/agents/debug-agents/code-render-debug-agent/samples/"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint and shellcheck
        env:
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        # GITHUB_PATH only gets the fixed directory created here, which holds
        # just the checksum-verified binaries; no input reaches it
        run: | # zizmor: ignore[github-env]
          bin="$RUNNER_TEMP/lint-tools"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          fetch() {
            curl -sSfL -o "$2" "$1"
            echo "$3  $2" | sha256sum -c
          }
          fetch "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-x86_64" \
            hadolint "$HADOLINT_SHA256"
          install -m 755 hadolint "$bin/hadolint"
          fetch "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.gz" \
            shellcheck.tgz "$SHELLCHECK_SHA256"
          tar -xzf shellcheck.tgz -C "$bin" --strip-components 1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"
      - name: hadolint
        run: |
          hadolint --version
          mapfile -t files < <(git ls-files -- '*Dockerfile' '*Dockerfile.*' '*.Dockerfile' "$EXCLUDE")
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No Dockerfiles found"; exit 1; }
          hadolint "${files[@]}"
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          shellcheck --version
          files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *.sh|*.bash) files+=("$f") ;;
              *) head -n1 "$f" | grep -qE '^#!.*[/ ](ba|da|k)?sh( |$)' && files+=("$f") ;;
            esac
          done < <(git ls-files -z -- . "$EXCLUDE")
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No shell scripts found"; exit 1; }
          shellcheck "${files[@]}"

  k3d-cluster:
    name: "k3d: cluster targets"
    needs: gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: platform
    env:
      # Tilt isn't used by these targets yet, and isn't installed here
      SKIP_PREREQUISITES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm, kubectl and k3d
        uses: ./.github/actions/setup-kube-tools
        with:
          cluster-tools: "true"
      - name: Create the cluster
        run: make cluster-up
      - name: Check the node
        run: kubectl --context k3d-prometheus wait --for=condition=Ready node --all --timeout=120s
      - name: Check the registry
        # Push from the host as localhost:5001, pull from a pod by the in-cluster name
        run: |
          docker pull -q busybox:1.37
          docker tag busybox:1.37 localhost:5001/smoke:ci
          docker push -q localhost:5001/smoke:ci
          kubectl --context k3d-prometheus run smoke --restart=Never \
            --image=k3d-prometheus-registry.localhost:5001/smoke:ci -- true
          kubectl --context k3d-prometheus wait --for=jsonpath='{.status.phase}'=Succeeded \
            pod/smoke --timeout=120s
      - name: Check the ingress port
        # Traefik answers 404 until something is deployed; any response means 8080 reaches it
        run: |
          for _ in $(seq 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)"
            [ "$code" = 404 ] && exit 0
            sleep 3
          done
          echo "Expected 404 from Traefik on localhost:8080, last got '$code'" >&2
          exit 1
      - name: Run cluster-up again
        # A running cluster is left alone
        run: make cluster-up | tee "$RUNNER_TEMP/up.log" && grep -q 'already running' "$RUNNER_TEMP/up.log"
      - name: Start a stopped cluster
        run: |
          k3d cluster stop prometheus
          make cluster-up
          kubectl --context k3d-prometheus wait --for=condition=Ready node --all --timeout=120s
      - name: Reset the cluster
        # A new cluster, so the smoke pod from before is gone
        run: |
          make cluster-reset
          kubectl --context k3d-prometheus wait --for=condition=Ready node --all --timeout=120s
          ! kubectl --context k3d-prometheus get pod smoke 2>/dev/null
      - name: Delete the cluster
        run: |
          make cluster-down
          ! k3d cluster get prometheus 2>/dev/null
      - name: Show status
        if: ${{ failure() }}
        run: |
          k3d cluster list
          kubectl --context k3d-prometheus get nodes,pods -A -o wide || true
          kubectl --context k3d-prometheus describe pod smoke || true

  hackathon-slides:
    name: "hackathon: slides"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: hackathon/slides
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Build
        run: make build
      - name: Check generated decks are up to date
        run: |
          if [ -n "$(git status --porcelain .)" ]; then
            git status --short .
            git --no-pager diff --stat .
            echo "::error::The generated slides are out of date. Run 'make build' in hackathon/slides and commit the result."
            exit 1
          fi

  platform-docs:
    name: "platform: docs"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Build
        run: uv run --frozen zensical build --clean
      - name: Check for hackathon collision
        # The pages workflow serves the hackathon slides from /hackathon/
        run: |
          if [ -e site/hackathon ]; then
            echo "::error::The docs build produced site/hackathon, which collides with the hackathon slides on the Pages site. Rename that docs page or folder."
            exit 1
          fi

  sdk-python:
    name: "sdk: python ${{ matrix.python }}"
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        run: uv sync --frozen
      - name: Test
        # Fails below fail_under in pyproject.toml on every version
        run: uv run --frozen pytest --color=yes --cov --cov-report=xml
      - name: Coverage
        # Report and upload only on 3.12, so the sdk reports once per commit
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: ./.github/actions/coverage
        with:
          directory: sdk
          flag: sdk
          token: ${{ secrets.CODECOV_TOKEN }}

  sdk-install:
    name: "sdk: install"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Test install
        # Builds the wheel and imports every package from a clean venv
        run: make test-install

  agent-template:
    name: "agent-template: python ${{ matrix.python }}"
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agent-template
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        run: uv sync --frozen
      - name: Test
        # Fails below fail_under in pyproject.toml on every version
        run: uv run --frozen pytest --color=yes --cov --cov-report=xml
      - name: Coverage
        # Report and upload only on 3.12, so the scaffolder reports once per commit
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: ./.github/actions/coverage
        with:
          directory: agent-template
          flag: agent-template
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: uv run --frozen mypy .

  agent-template-scaffold:
    name: "agent-template: scaffold python ${{ matrix.python }}"
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        # For agent-template's locked ruff
        working-directory: agent-template
        run: uv sync --frozen --only-dev
      - name: Scaffold
        working-directory: agent-template
        run: uv run --frozen --no-sync python setup_agent.py --yes "Smoke Test" "$RUNNER_TEMP/smoke-test"
      - name: Check for placeholders
        working-directory: ${{ runner.temp }}/smoke-test
        run: |
          if grep -rn 'TEMPLATE_[A-Z]' .; then
            echo "::error::The scaffolded agent still has template placeholders"
            exit 1
          fi
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/smoke-test
        env:
          # The scaffold pins .python-version to 3.12; test the matrix version
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON"
          uv pip install -r pyproject.toml pytest pytest-asyncio "$GITHUB_WORKSPACE/sdk"
      - name: Lint
        working-directory: ${{ runner.temp }}/smoke-test
        env:
          UV_PROJECT: ${{ github.workspace }}/agent-template
        run: |
          uv run --frozen --no-sync ruff check --output-format=github .
          uv run --frozen --no-sync ruff format --check --diff .
      - name: Test
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/smoke-test
        run: .venv/bin/python -m pytest --color=yes

  sdk-docker:
    name: "sdk: docker ${{ matrix.platform }}"
    needs: gitleaks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sdk
          file: sdk/Dockerfile
          build-contexts: certs=common/certs
          platforms: linux/${{ matrix.platform }}
          push: false
          load: true
          tags: sdk:${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}_sdk-devel:${{ matrix.platform }}
      - name: Test
        # The image only has the installed package; mount the checkout for
        # pyproject.toml, uv.lock, and the tests
        run: |
          docker run --rm --platform linux/${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            sdk:${{ matrix.platform }} \
            bash -ec '
              uv export --frozen --only-dev > requirements.txt
              uv pip install -r requirements.txt
              rm requirements.txt
              pytest --color=yes
            '

  platform-frontend-npm:
    name: "platform: frontend npm"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the node image in frontend/Dockerfile
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:coverage
      # The shared coverage action reads Python's coverage report, so the
      # frontend's summary, path prefix and upload are done here instead
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          total=$(node -p 'require("./coverage/coverage-summary.json").total.lines.pct')
          echo "frontend line coverage: **${total}%**" >> "$GITHUB_STEP_SUMMARY"
      - name: Prefix coverage paths
        if: ${{ !cancelled() }}
        # Report names are relative to the frontend; make them repo-root-relative
        run: sed -i 's#filename="#filename="platform/frontend/#' coverage/cobertura-coverage.xml
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend
          files: platform/frontend/coverage/cobertura-coverage.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Build
        run: npm run build

  platform-frontend-docker:
    name: "platform: frontend docker ${{ matrix.platform }}"
    needs: gitleaks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Same context, target, and certs context as docker-compose.yml
          context: platform
          file: platform/frontend/Dockerfile
          target: prod
          build-contexts: certs=common/certs
          platforms: linux/${{ matrix.platform }}
          push: false
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}_frontend-devel:${{ matrix.platform }}

  platform-backend-docker:
    name: "platform: backend docker ${{ matrix.platform }}"
    needs: gitleaks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Same context and sdk/certs contexts as docker-compose.yml
          context: platform/backend
          file: platform/backend/Dockerfile
          build-contexts: |
            sdk=sdk
            certs=common/certs
          platforms: linux/${{ matrix.platform }}
          push: false
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}_backend-devel:${{ matrix.platform }}

  platform-backend-python:
    name: "platform: backend python ${{ matrix.python }}"
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        run: uv sync --frozen
      - name: Type check
        run: uv run --frozen --no-sync mypy app
      - name: Test
        # Fails below fail_under in pyproject.toml on every version
        run: uv run --frozen --no-sync pytest --color=yes --cov --cov-report=xml
      - name: Coverage
        # Report and upload only on 3.12, so the backend reports once per commit
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: ./.github/actions/coverage
        with:
          directory: platform/backend
          flag: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  platform-backend-alembic:
    # The unit tests run on in-memory SQLite, so this is the only place the
    # models meet real Postgres and asyncpg outside the compose stack. Upgrades
    # an empty database to head, then fails if the models differ from the
    # migrated schema, such as a model change committed without a migration
    name: "platform: backend alembic check"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/backend
    env:
      ADMIN_DATABASE_URL: postgresql+asyncpg://admin:ci-test-password@localhost:5432/admin
    services:
      admin-db:
        # The same image as admin-db in platform/docker-compose.yml
        image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --frozen
      - name: Upgrade
        run: uv run --frozen --no-sync alembic upgrade head
      - name: Check
        # Exits non-zero and prints the diff if the models have drifted
        run: uv run --frozen --no-sync alembic check

  platform-infrastructure:
    name: "platform: infrastructure"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --frozen
      - name: Test
        # Integration tests need the running platform. python -m puts the
        # current directory on sys.path, which the tests need to import system/
        run: uv run --frozen --no-sync python -m pytest --color=yes -m "not integration"

  platform-compose:
    name: "platform: compose"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform
    env:
      # Placeholders for the variables .env sets, which init_env.py generates
      # in make up. config only interpolates them
      ADMIN_DB_PASSWORD: placeholder
      AGENT_SECRET: placeholder
      DEEPLYNX_DB_PASSWORD: placeholder
      DEEPLYNX_ENCRYPTION_IV: placeholder
      DEEPLYNX_ENCRYPTION_KEY: placeholder
      DEEPLYNX_JWT_SECRET: placeholder
      DEEPLYNX_UI_SECRET: placeholder
      LITELLM_DB_PASSWORD: placeholder
      LITELLM_LOCAL_PORT: "9977"
      LITELLM_MASTER_KEY: placeholder
      LLM_API_KEY: placeholder
      LLM_CONFIG_PROFILE: placeholder
      PROMETHEUS_API_BASE_IMAGE_HASH: placeholder
      REDIS_PASSWORD: placeholder
      # For docker-compose.build-cache.yml, with BUILD_CACHE from the workflow
      BUILD_CACHE_PLATFORM: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate
        # Every combination of debug agents, optional agents, the system-test
        # file and the local DeepLynx, each after its own make generate. The
        # same files the Makefile passes, with both profiles so every service
        # is checked. Fails on warnings too, such as an unset variable
        run: |
          failed=0
          for debug in false true; do
            for optional in false true; do
              for system_test in false true; do
                for deeplynx in false true; do
                  combo="debug=$debug optional=$optional system-test=$system_test deeplynx=$deeplynx"
                  echo "::group::compose $combo"
                  files=(-f docker-compose.yml -f docker-compose.agents.yml -f docker-compose.build-cache.yml)
                  if [ "$system_test" = true ]; then
                    files+=(-f docker-compose.system-test.yml)
                  fi
                  if [ "$deeplynx" = true ]; then
                    files+=(-f docker-compose.deeplynx.yml)
                  fi
                  if ! DEBUG_AGENTS=$debug OPTIONAL_AGENTS=$optional make generate; then
                    echo "::error::make generate failed for $combo"
                    failed=1
                  elif ! docker compose "${files[@]}" --profile dev --profile prod config -q 2> "$RUNNER_TEMP/config.log"; then
                    cat "$RUNNER_TEMP/config.log"
                    echo "::error::docker compose config failed for $combo"
                    failed=1
                  elif [ -s "$RUNNER_TEMP/config.log" ]; then
                    cat "$RUNNER_TEMP/config.log"
                    echo "::error::docker compose config printed warnings for $combo"
                    failed=1
                  fi
                  echo "::endgroup::"
                done
              done
            done
          done
          exit $failed

  agent-template-compose:
    name: "agent-template: compose"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agent-template/agent_template
    env:
      # Placeholders for the variables .env sets. config only interpolates them
      AGENT_SECRET: placeholder
      LITELLM_MASTER_KEY: placeholder
      LLM_CONFIG_PROFILE: placeholder
      REDIS_PASSWORD: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate
        # Each network mode, with the same files the Makefile passes. External
        # mode sets the host and port together, as the Makefile requires. Fails
        # on warnings too, such as an unset variable
        run: |
          failed=0
          for network in internal external; do
            echo "::group::compose $network"
            if [ "$network" = external ]; then
              export EXTERNAL_AGENT_HOST=localhost EXTERNAL_AGENT_PORT=8042
            else
              unset EXTERNAL_AGENT_HOST EXTERNAL_AGENT_PORT
            fi
            if ! docker compose -f docker-compose.yml -f "docker-compose.net_$network.yml" config -q 2> "$RUNNER_TEMP/config.log"; then
              cat "$RUNNER_TEMP/config.log"
              echo "::error::docker compose config failed for $network"
              failed=1
            elif [ -s "$RUNNER_TEMP/config.log" ]; then
              cat "$RUNNER_TEMP/config.log"
              echo "::error::docker compose config printed warnings for $network"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  # Follows the in-tree deployment path in agent-template/TUTORIAL.md (Step 1,
  # then Step 9): scaffold an agent, uv sync, copy it to platform/agents/, then
  # make generate and make up. Then checks it through the backend. Stub
  # credentials, as in platform: up.
  #
  # Keep in sync with the "In-tree deployment" sections of
  # agent-template/TUTORIAL.md and the scaffolding notes in
  # agent-template/README.md: a change to those steps belongs here too. The
  # steps marked CI only are not part of the documented flow.
  agent-template-platform:
    name: "agent-template: platform"
    needs: [gitleaks, platform-compose, agent-template-scaffold]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    env:
      # CI only: build the prometheus_api base image from ../sdk, so the PR's
      # SDK is tested, instead of pulling the pinned registry image
      LOCAL_SDK: "true"
      # The default agents (client-agent, form-filler, synthesis) start with the
      # scaffolded one. No debug or optional agents, and no frontend
      DEBUG_AGENTS: "false"
      OPTIONAL_AGENTS: "false"
      PROFILE: ""
      # The scaffolded agent re-checks its registration every second, so the
      # registry-reset step finishes as soon as the agent is back
      REGISTRY_CHECK_INTERVAL_SECONDS: "1"
      # CI only: stub credentials, as in platform: up
      LLM_CONFIG_PROFILE: anthropic
      LLM_API_KEY: sk-ant-test-not-real
      DEEPLYNX_KEY: ci-test-key
      DEEPLYNX_SECRET: ci-test-secret
      DEEPLYNX_ORG_ID: "1"
      DEEPLYNX_PROJECT_ID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Create platform .env
        # Before scaffolding, so setup_agent.py copies the platform's secrets
        # into the agent's .env, as README.md describes
        run: |
          make init-env
          # CI only: once .env exists, make loads it over the environment, and
          # its blank DEEPLYNX_* lines would hide the stubs from every container
          sed -i.bak \
            -e "s|^DEEPLYNX_KEY=.*|DEEPLYNX_KEY=$DEEPLYNX_KEY|" \
            -e "s|^DEEPLYNX_SECRET=.*|DEEPLYNX_SECRET=$DEEPLYNX_SECRET|" \
            -e "s|^DEEPLYNX_ORG_ID=.*|DEEPLYNX_ORG_ID=$DEEPLYNX_ORG_ID|" \
            -e "s|^DEEPLYNX_PROJECT_ID=.*|DEEPLYNX_PROJECT_ID=$DEEPLYNX_PROJECT_ID|" \
            .env
          rm .env.bak
      - name: Scaffold
        # TUTORIAL.md Step 1. The agent registers as ci-check-agent, from the
        # card name "CI Check Agent"
        run: python3 ../agent-template/setup_agent.py --yes "CI Check" "$RUNNER_TEMP/ci-check-agent"
      - name: Sync
        # TUTORIAL.md Step 1. Creates the uv.lock the Dockerfile requires
        working-directory: ${{ runner.temp }}/ci-check-agent
        run: uv sync
      - name: Copy into the platform
        # TUTORIAL.md Step 9, in-tree deployment
        run: |
          cp -R "$RUNNER_TEMP/ci-check-agent" agents/ci-check-agent
          # CI only: the image installs its own dependencies, so keep the
          # venv out of the Docker build context
          rm -rf agents/ci-check-agent/.venv
      - name: Point the agent at the backend registry
        # CI only: the template compose still defaults to LiteLLM, but the
        # platform's registry is the backend, and it checks AGENT_SECRET. The
        # same two lines the platform's own agents have. Remove this step once
        # the template compose has them (open PR #276). The platform's .env and
        # this job's environment fill in the variables, not the agent's .env
        working-directory: platform/agents/ci-check-agent
        run: |
          sed -i \
            -e 's|REGISTRY_URL: .*|REGISTRY_URL: http://backend:8000|' \
            -e "s|LITELLM_MASTER_KEY: .*|LITELLM_MASTER_KEY: \${AGENT_SECRET}|" \
            docker-compose.yml
          grep -n 'REGISTRY_URL\|LITELLM_MASTER_KEY' docker-compose.yml
      - name: Generate
        # TUTORIAL.md Step 9. Lists the agents make up will start
        run: make generate
      - name: Use the containerd image store
        # CI only: make up imports the registry build cache, which the default
        # builder can only do with this store
        uses: ./.github/actions/containerd-image-store
      - name: Start
        # TUTORIAL.md Step 9. Waits for every healthcheck, then make check
        # waits for every agent, the scaffolded one included, to be registered
        # with the backend
        run: make up
      - name: Check the agent card
        # TUTORIAL.md Step 9, verify registration. What the client-agent would
        # read: the card the scaffolded agent registered, served by the backend
        # gateway. The tutorial's LiteLLM check on port 9977 is what #276 replaces
        run: |
          secret=$(sed -n 's/^AGENT_SECRET=//p' .env)
          echo "::add-mask::$secret"
          curl -fsS -H "Authorization: Bearer $secret" http://localhost:8600/a2a/ci-check-agent > "$RUNNER_TEMP/card.json"
          python3 - "$RUNNER_TEMP/card.json" <<'EOF'
          import json
          import sys

          card = json.load(open(sys.argv[1]))
          skills = [skill["id"] for skill in card["skills"]]
          assert card["name"] == "CI Check Agent", card["name"]
          assert skills == ["ci_check_analysis"], skills
          print(f"{card['name']}: {skills}")
          EOF
      - name: Survive a registry reset
        # The platform resets the registry on every make up and make restart.
        # An agent that keeps running must register again by itself (SDK
        # keep_registered_async), not drop out of discovery until it restarts.
        # Delete the scaffolded agent's entry as a reset would, then poll until
        # it is back (the agent re-checks every second, see the job env)
        run: |
          secret=$(sed -n 's/^AGENT_SECRET=//p' .env)
          echo "::add-mask::$secret"
          registry=http://localhost:8600/v1/agents
          listed() {
            curl -fsS -H "Authorization: Bearer $secret" "$registry" \
              | python3 -c 'import json, sys; sys.exit(0 if any(e.get("agent_name") == "ci-check-agent" for e in json.load(sys.stdin)) else 1)'
          }
          curl -fsS -X DELETE -H "Authorization: Bearer $secret" "$registry/ci-check-agent"
          if listed; then
            echo "::error::ci-check-agent is still listed right after the delete"
            exit 1
          fi
          start_ms=$(($(date +%s%N) / 1000000))
          deadline=$((SECONDS + 30))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if listed; then
              echo "ci-check-agent re-registered by itself after $(($(date +%s%N) / 1000000 - start_ms)) ms"
              exit 0
            fi
            sleep 0.01
          done
          echo "::error::ci-check-agent did not re-register within 30 s of a registry reset"
          exit 1
      - name: Show status
        if: ${{ failure() }}
        run: docker ps --all
      - name: Collect logs
        if: ${{ failure() }}
        env:
          COMPOSE_PROJECT_NAME: prometheus_platform
          COMPOSE_FILE: docker-compose.yml:docker-compose.agents.yml
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          for service in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$service" > "$RUNNER_TEMP/logs/$service.log"
          done
          docker ps --all > "$RUNNER_TEMP/logs/ps.txt"
          cat "$RUNNER_TEMP/logs"/*.log
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-template-platform-logs
          path: ${{ runner.temp }}/logs/
          retention-days: 14
      - name: Stop
        if: ${{ always() }}
        run: make down-v

  # Runs on every PR, merge queue and devel push like the rest of this
  # workflow: the whole job, build included, takes a few minutes, so nightly
  # would only delay the failures. See platform/tests/README.md for why no
  # real LLM key is needed.
  platform-up:
    name: "platform: up"
    # Skip the slow start when a compose file doesn't even parse
    needs: [gitleaks, platform-compose]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    env:
      # Build the prometheus_api base image from ../sdk instead of pulling it
      LOCAL_SDK: "true"
      DEBUG_AGENTS: "true"
      OPTIONAL_AGENTS: "false"
      PROFILE: prod
      # make up runs init_env.py, which creates .env from .env.example,
      # generates every secret, and takes the profile and its key from the
      # environment. Nothing calls an LLM or DeepLynx at startup, so
      # placeholders are enough.
      LLM_CONFIG_PROFILE: anthropic
      LLM_API_KEY: sk-ant-test-not-real
      DEEPLYNX_KEY: ci-test-key
      DEEPLYNX_SECRET: ci-test-secret
      DEEPLYNX_ORG_ID: "1"
      DEEPLYNX_PROJECT_ID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Use the containerd image store
        # make up imports the registry build cache, which the default builder
        # can only do with this store
        uses: ./.github/actions/containerd-image-store
      - name: Create .env
        # Once .env exists, make loads it over the environment, and its blank
        # DEEPLYNX_* lines would hide the stubs from every later start
        run: |
          make init-env
          sed -i.bak \
            -e "s|^DEEPLYNX_KEY=.*|DEEPLYNX_KEY=$DEEPLYNX_KEY|" \
            -e "s|^DEEPLYNX_SECRET=.*|DEEPLYNX_SECRET=$DEEPLYNX_SECRET|" \
            -e "s|^DEEPLYNX_ORG_ID=.*|DEEPLYNX_ORG_ID=$DEEPLYNX_ORG_ID|" \
            -e "s|^DEEPLYNX_PROJECT_ID=.*|DEEPLYNX_PROJECT_ID=$DEEPLYNX_PROJECT_ID|" \
            .env
          rm .env.bak
      - name: Start
        # make up waits for every healthcheck, then runs make check: the
        # backend and frontend on their host ports, the frontend's /api proxy,
        # and every agent registered with the backend
        run: make up
      - name: Sync test environment
        working-directory: platform/tests
        run: uv sync --frozen
      - name: Integration tests
        # Against the stack make up started: the tests find it running and use
        # it, with the credentials and ports in platform/.env
        env:
          UV_FROZEN: "1"
          UV_NO_SYNC: "1"
        run: make test-integration
      # The other start targets, against the running stack. Each one except
      # the -fg ones ends with make check. .env has every secret make up
      # generated, so it has to stay as it is through all of them
      - name: Save .env
        run: cp .env "$RUNNER_TEMP/platform.env"
      - name: Restart
        run: |
          make restart
          diff "$RUNNER_TEMP/platform.env" .env
      - name: Restart without regenerating
        run: |
          make ng-restart
          diff "$RUNNER_TEMP/platform.env" .env
      - name: Stop and restart
        run: |
          make down
          make restart
          diff "$RUNNER_TEMP/platform.env" .env
      - name: Delete the volumes and start
        run: |
          make down-v
          make up
          diff "$RUNNER_TEMP/platform.env" .env
      - name: Integration tests again
        # Against the stack the last make up started, on empty volumes
        env:
          UV_FROZEN: "1"
          UV_NO_SYNC: "1"
        run: make test-integration
      - name: Show status
        if: ${{ failure() }}
        run: docker ps --all
      - name: Collect logs
        if: ${{ failure() }}
        # The same files and profile make up used, so the agents are included
        env:
          COMPOSE_PROJECT_NAME: prometheus_platform
          COMPOSE_FILE: docker-compose.yml:docker-compose.agents.yml
        run: |
          export COMPOSE_PROFILES="$PROFILE"
          mkdir -p "$RUNNER_TEMP/logs"
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/logs/all.log"
          for service in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$service" > "$RUNNER_TEMP/logs/$service.log"
          done
          docker ps --all > "$RUNNER_TEMP/logs/ps.txt"
          cat "$RUNNER_TEMP/logs/all.log"
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-up-logs
          path: ${{ runner.temp }}/logs/
          retention-days: 14
      - name: Stop
        if: ${{ always() }}
        run: make down-v

  platform-up-deeplynx:
    # platform: up with LOCAL_DEEPLYNX=true: DeepLynx from its published images
    # next to the platform, which make deeplynx-setup points DEEPLYNX_* at, so
    # the integration tests can store in and read from a real DeepLynx
    name: "platform: up deeplynx"
    # Skip the slow start when a compose file doesn't even parse
    needs: [gitleaks, platform-compose]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    env:
      # Build the prometheus_api base image from ../sdk instead of pulling it
      LOCAL_SDK: "true"
      # Only the default agents and no frontend: platform: up covers the rest,
      # and this job starts the stack five times
      DEBUG_AGENTS: "false"
      OPTIONAL_AGENTS: "false"
      PROFILE: ""
      LOCAL_DEEPLYNX: "true"
      # make up runs init_env.py, which creates .env from .env.example,
      # generates every secret, and takes the profile and its key from the
      # environment. Nothing calls an LLM at startup, so a placeholder is
      # enough. The DeepLynx settings come from make deeplynx-setup
      LLM_CONFIG_PROFILE: anthropic
      LLM_API_KEY: sk-ant-test-not-real
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Use the containerd image store
        # make up imports the registry build cache, which the default builder
        # can only do with this store
        uses: ./.github/actions/containerd-image-store
      - name: Start
        # make up waits for every healthcheck, then runs make check: the
        # backend and frontend on their host ports, the frontend's /api proxy,
        # and every agent registered with the backend
        run: make up
      - name: Sync test environment
        working-directory: platform/tests
        run: uv sync --frozen
      - name: Integration tests
        # Against the stack make up started: the tests find it running and use
        # it, with the credentials and ports in platform/.env
        env:
          UV_FROZEN: "1"
          UV_NO_SYNC: "1"
        run: make test-integration
      # The other start targets, against the running stack. Each one runs
      # make deeplynx-setup again and, except the -fg ones, ends with make
      # check. DeepLynx keeps its data until make down-v, so the key in .env
      # has to survive every step before that, and a new one is saved after
      - name: Save the DeepLynx settings
        run: grep '^DEEPLYNX_' .env > "$RUNNER_TEMP/deeplynx.env"
      - name: Restart
        run: |
          make restart
          diff "$RUNNER_TEMP/deeplynx.env" <(grep '^DEEPLYNX_' .env)
      - name: Restart without regenerating
        run: |
          make ng-restart
          diff "$RUNNER_TEMP/deeplynx.env" <(grep '^DEEPLYNX_' .env)
      - name: Stop and restart
        # make down keeps the volumes, so DeepLynx still accepts the key
        run: |
          make down
          make restart
          diff "$RUNNER_TEMP/deeplynx.env" <(grep '^DEEPLYNX_' .env)
      - name: Delete the volumes and start
        # A fresh DeepLynx rejects the old key, so a new one is saved
        run: |
          make down-v
          make up
          if diff -q "$RUNNER_TEMP/deeplynx.env" <(grep '^DEEPLYNX_' .env) > /dev/null; then
            echo "::error::make up kept the DeepLynx key from before make down-v"
            exit 1
          fi
      - name: Integration tests again
        # With the key make up saved after make down-v
        env:
          UV_FROZEN: "1"
          UV_NO_SYNC: "1"
        run: make test-integration
      - name: Show status
        if: ${{ failure() }}
        run: docker ps --all
      - name: Collect logs
        if: ${{ failure() }}
        # The same files and profile make up used, so the agents are included
        env:
          COMPOSE_PROJECT_NAME: prometheus_platform
          COMPOSE_FILE: docker-compose.yml:docker-compose.agents.yml:docker-compose.deeplynx.yml
        run: |
          export COMPOSE_PROFILES="$PROFILE"
          mkdir -p "$RUNNER_TEMP/logs"
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/logs/all.log"
          for service in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$service" > "$RUNNER_TEMP/logs/$service.log"
          done
          docker ps --all > "$RUNNER_TEMP/logs/ps.txt"
          cat "$RUNNER_TEMP/logs/all.log"
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-up-deeplynx-logs
          path: ${{ runner.temp }}/logs/
          retention-days: 14
      - name: Stop
        if: ${{ always() }}
        run: make down-v

  platform-agent:
    name: "platform: agent ${{ matrix.agent }}"
    needs: gitleaks
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: client-agent
            path: platform/agents/client-agent
            flag: client-agent
          - agent: osti-research-agent
            path: platform/agents/optional/osti-research-agent
            flag: osti-research-agent
            # marker-pdf pulls in PyTorch with CUDA and the tests don't use it
            overrides: "marker-pdf; sys_platform == 'never'"
          - agent: code-render-debug-agent
            path: platform/agents/debug-agents/code-render-debug-agent
            flag: code-render-debug-agent
          - agent: corrosion-agent
            path: platform/agents/debug-agents/corrosion-agent
            flag: corrosion-agent
          - agent: thermal-agent
            path: platform/agents/debug-agents/thermal-agent
            flag: thermal-agent
          - agent: form-filler-agent
            path: platform/agents/form-filler-agent
            flag: form-filler-agent
          - agent: synthesis-agent
            path: platform/agents/synthesis-agent
            flag: synthesis-agent
          - agent: artifact-debug-agent
            path: platform/agents/debug-agents/artifact-debug-agent
            flag: artifact-debug-agent
          - agent: material-data-agent
            path: platform/agents/debug-agents/material-data-agent
            flag: material-data-agent
          - agent: radiation-agent
            path: platform/agents/debug-agents/radiation-agent
            flag: radiation-agent
          - agent: thread-pattern-agent
            path: platform/agents/debug-agents/thread-pattern-agent
            flag: thread-pattern-agent
          - agent: agent-template
            path: agent-template/agent_template
            flag: template-agent
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Install dependencies
        # Like the agent images: prometheus_api first, then the agent's locked
        # dependencies on top. An agent with overrides resolves fresh instead,
        # since its uv.lock doesn't have them
        env:
          OVERRIDES: ${{ matrix.overrides }}
        run: |
          uv venv
          uv pip install pytest pytest-asyncio pytest-cov "$GITHUB_WORKSPACE/sdk"
          if [ -n "$OVERRIDES" ]; then
            printf '%s\n' "$OVERRIDES" > "$RUNNER_TEMP/overrides.txt"
            uv pip install -r pyproject.toml --overrides "$RUNNER_TEMP/overrides.txt"
          else
            uv sync --locked --no-dev --no-install-project --inexact
          fi
      - name: Test
        # Agents with a flag fail below fail_under in their pyproject.toml
        run: .venv/bin/python -m pytest --color=yes ${{ matrix.flag && '--cov --cov-report=xml' || '' }}
      - name: Coverage
        if: ${{ !cancelled() && matrix.flag }}
        uses: ./.github/actions/coverage
        with:
          directory: ${{ matrix.path }}
          flag: ${{ matrix.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
