name: test

on:
  push:
    branches: [devel]
  pull_request:
    branches: [main, devel]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: "gitleaks"
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trust workspace
        # The checkout isn't owned by the container user, and without this git
        # refuses to read it and gitleaks passes without scanning anything
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Scan
        # Only the commits being added: the PR's commits, the merge group's, or
        # the pushed ones. Each event sets only its own base, the others are empty
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # gitleaks passes without scanning if the range is empty or the base
          # commit is missing, so check the range with git first
          count=$(git rev-list --count "$BASE_SHA..$HEAD_SHA")
          if [ "$count" -eq 0 ]; then
            echo "::error::No commits to scan in $BASE_SHA..$HEAD_SHA"
            exit 1
          fi
          gitleaks git --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA" .

  ruff:
    name: "ruff ${{ matrix.project }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - sdk
          - platform/backend
          - platform/tests
          - platform/scripts
          - platform/agents
          - agent-template
        include:
          # Not a uv project; linted with platform/tests' locked ruff
          - project: platform/scripts
            uv-project: ../tests
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      UV_PROJECT: ${{ matrix.uv-project || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Sync environment
        # Only the dev group, for each project's locked ruff version
        run: uv sync --frozen --only-dev
      - name: Check
        run: uv run --frozen --no-sync ruff check --output-format=github .
      - name: Format
        if: ${{ !cancelled() }}
        run: uv run --frozen --no-sync ruff format --check --diff .

  markings:
    name: "markings"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check
        run: python3 platform/scripts/add_markings.py --check

  uv-lock:
    # uv lock --check in every directory with a tracked uv.lock, so a
    # pyproject.toml change can't land without re-locking. New uv projects are
    # found by their uv.lock; npm ci covers the frontend's package-lock.json
    name: "uv lock"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Check
        # Checks every project before failing, so one run lists them all
        run: |
          mapfile -t locks < <(git ls-files -- 'uv.lock' '*/uv.lock')
          [ "${#locks[@]}" -gt 0 ] || { echo "::error::No uv.lock files found"; exit 1; }
          failed=0
          for lock in "${locks[@]}"; do
            dir="$(dirname "$lock")"
            echo "::group::$dir"
            if ! uv lock --check --directory "$dir"; then
              echo "::error file=$lock::$lock is out of date with $dir/pyproject.toml. Run 'uv lock' in $dir and commit the result."
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  image-pins:
    # Every Dockerfile FROM and compose image: is pinned by digest, so a tag
    # can't silently move. Dependabot keeps the tag and digest current
    name: "image pins"
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check
        run: python3 platform/scripts/check_image_pins.py

  hadolint-shellcheck:
    # hadolint on every Dockerfile and shellcheck on every shell script, found
    # by name or shebang. Config is in .hadolint.yaml
    name: "hadolint + shellcheck"
    runs-on: ubuntu-26.04
    env:
      # Syntax-highlighting fixtures for the code-render agent, not real files
      EXCLUDE: ":(exclude)platform/agents/debug-agents/code-render-debug-agent/samples/"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint and shellcheck
        env:
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        # GITHUB_PATH only gets the fixed directory created here, which holds
        # just the checksum-verified binaries; no input reaches it
        run: | # zizmor: ignore[github-env]
          bin="$RUNNER_TEMP/lint-tools"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          fetch() {
            curl -sSfL -o "$2" "$1"
            echo "$3  $2" | sha256sum -c
          }
          fetch "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-x86_64" \
            hadolint "$HADOLINT_SHA256"
          install -m 755 hadolint "$bin/hadolint"
          fetch "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.gz" \
            shellcheck.tgz "$SHELLCHECK_SHA256"
          tar -xzf shellcheck.tgz -C "$bin" --strip-components 1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"
      - name: hadolint
        run: |
          hadolint --version
          mapfile -t files < <(git ls-files -- '*Dockerfile' '*Dockerfile.*' '*.Dockerfile' "$EXCLUDE")
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No Dockerfiles found"; exit 1; }
          hadolint "${files[@]}"
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          shellcheck --version
          files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *.sh|*.bash) files+=("$f") ;;
              *) head -n1 "$f" | grep -qE '^#!.*[/ ](ba|da|k)?sh( |$)' && files+=("$f") ;;
            esac
          done < <(git ls-files -z -- . "$EXCLUDE")
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No shell scripts found"; exit 1; }
          shellcheck "${files[@]}"

  k3d-cluster:
    name: "k3d: cluster targets"
    needs: gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: platform
    env:
      # Tilt isn't used by these targets yet, and isn't installed here
      SKIP_PREREQUISITES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm, kubectl and k3d
        uses: ./.github/actions/setup-kube-tools
        with:
          cluster-tools: "true"
      - name: Create the cluster
        run: make cluster-up
      - name: Check the node
        run: kubectl --context k3d-prometheus wait --for=condition=Ready node --all --timeout=120s
      - name: Check the registry
        # Push from the host as localhost:5001, pull from a pod by the in-cluster name
        run: |
          docker pull -q busybox:1.37
          docker tag busybox:1.37 localhost:5001/smoke:ci
          docker push -q localhost:5001/smoke:ci
          kubectl --context k3d-prometheus run smoke --restart=Never \
            --image=k3d-prometheus-registry.localhost:5001/smoke:ci -- true
          kubectl --context k3d-prometheus wait --for=jsonpath='{.status.phase}'=Succeeded \
            pod/smoke --timeout=120s
      - name: Check the ingress port
        # Traefik answers 404 until something is deployed; any response means 8080 reaches it
        run: |
          for _ in $(seq 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)"
            [ "$code" = 404 ] && exit 0
            sleep 3
          done
          echo "Expected 404 from Traefik on localhost:8080, last got '$code'" >&2
          exit 1
      - name: Run cluster-up again
        # A running cluster is left alone
        run: make cluster-up | tee "$RUNNER_TEMP/up.log" && grep -q 'already running' "$RUNNER_TEMP/up.log"
      - name: Start a stopped cluster
        run: |
          k3d cluster stop prometheus
          make cluster-up
          kubectl --context k3d-prometheus wait --for=condition=Ready node --all --timeout=120s
      - name: Reset the cluster
        # A new cluster, so the smoke pod from before is gone
        run: |
          make cluster-reset
          kubectl --context k3d-prometheus wait --for=condition=Ready node --all --timeout=120s
          ! kubectl --context k3d-prometheus get pod smoke 2>/dev/null
      - name: Delete the cluster
        run: |
          make cluster-down
          ! k3d cluster get prometheus 2>/dev/null
      - name: Show status
        if: ${{ failure() }}
        run: |
          k3d cluster list
          kubectl --context k3d-prometheus get nodes,pods -A -o wide || true
          kubectl --context k3d-prometheus describe pod smoke || true

  hackathon-slides:
    name: "hackathon: slides"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: hackathon/slides
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Build
        run: make build
      - name: Check generated decks are up to date
        run: |
          if [ -n "$(git status --porcelain .)" ]; then
            git status --short .
            git --no-pager diff --stat .
            echo "::error::The generated slides are out of date. Run 'make build' in hackathon/slides and commit the result."
            exit 1
          fi

  platform-docs:
    name: "platform: docs"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Build
        run: uv run --frozen zensical build --clean
      - name: Check for hackathon collision
        # The pages workflow serves the hackathon slides from /hackathon/
        run: |
          if [ -e site/hackathon ]; then
            echo "::error::The docs build produced site/hackathon, which collides with the hackathon slides on the Pages site. Rename that docs page or folder."
            exit 1
          fi

  sdk-python:
    name: "sdk: python ${{ matrix.python }}"
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        run: uv sync --frozen
      - name: Test
        # Fails below fail_under in pyproject.toml on every version
        run: uv run --frozen pytest --color=yes --cov --cov-report=xml
      - name: Coverage
        # Report and upload only on 3.12, so the sdk reports once per commit
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: ./.github/actions/coverage
        with:
          directory: sdk
          flag: sdk
          token: ${{ secrets.CODECOV_TOKEN }}

  sdk-install:
    name: "sdk: install"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Test install
        # Builds the wheel and imports every package from a clean venv
        run: make test-install

  agent-template:
    name: "agent-template: python ${{ matrix.python }}"
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agent-template
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        run: uv sync --frozen
      - name: Test
        # Fails below fail_under in pyproject.toml on every version
        run: uv run --frozen pytest --color=yes --cov --cov-report=xml
      - name: Coverage
        # Report and upload only on 3.12, so the scaffolder reports once per commit
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: ./.github/actions/coverage
        with:
          directory: agent-template
          flag: agent-template
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: uv run --frozen mypy .

  agent-template-scaffold:
    name: "agent-template: scaffold python ${{ matrix.python }}"
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        # For agent-template's locked ruff
        working-directory: agent-template
        run: uv sync --frozen --only-dev
      - name: Scaffold
        working-directory: agent-template
        run: uv run --frozen --no-sync python setup_agent.py --yes "Smoke Test" "$RUNNER_TEMP/smoke-test"
      - name: Check for placeholders
        working-directory: ${{ runner.temp }}/smoke-test
        run: |
          if grep -rn 'TEMPLATE_[A-Z]' .; then
            echo "::error::The scaffolded agent still has template placeholders"
            exit 1
          fi
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/smoke-test
        env:
          # The scaffold pins .python-version to 3.12; test the matrix version
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON"
          uv pip install -r pyproject.toml pytest pytest-asyncio "$GITHUB_WORKSPACE/sdk"
      - name: Lint
        working-directory: ${{ runner.temp }}/smoke-test
        env:
          UV_PROJECT: ${{ github.workspace }}/agent-template
        run: |
          uv run --frozen --no-sync ruff check --output-format=github .
          uv run --frozen --no-sync ruff format --check --diff .
      - name: Test
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/smoke-test
        run: .venv/bin/python -m pytest --color=yes

  sdk-docker:
    name: "sdk: docker ${{ matrix.platform }}"
    needs: gitleaks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sdk
          file: sdk/Dockerfile
          build-contexts: certs=common/certs
          platforms: linux/${{ matrix.platform }}
          push: false
          load: true
          tags: sdk:${{ matrix.platform }}
          # Read-only: the cache written by publish-images on devel (same scope
          # as build-image.yml), so a PR only rebuilds the layers it changed
          cache-from: type=gha,scope=sdk-${{ matrix.platform }}
      - name: Test
        # The image only has the installed package; mount the checkout for
        # pyproject.toml, uv.lock, and the tests
        run: |
          docker run --rm --platform linux/${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            sdk:${{ matrix.platform }} \
            bash -ec '
              uv export --frozen --only-dev > requirements.txt
              uv pip install -r requirements.txt
              rm requirements.txt
              pytest --color=yes
            '

  platform-frontend-npm:
    name: "platform: frontend npm"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the node image in frontend/Dockerfile
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: node --test --experimental-strip-types 'src/**/*.test.ts'
      - name: Build
        run: npm run build

  platform-frontend-docker:
    name: "platform: frontend docker ${{ matrix.platform }}"
    needs: gitleaks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Same context, target, and certs context as docker-compose.yml
          context: platform
          file: platform/frontend/Dockerfile
          target: prod
          build-contexts: certs=common/certs
          platforms: linux/${{ matrix.platform }}
          push: false
          # Read-only: the cache written by publish-images on devel (same scope
          # as build-image.yml), so a PR only rebuilds the layers it changed
          cache-from: type=gha,scope=frontend-${{ matrix.platform }}

  platform-backend-docker:
    name: "platform: backend docker ${{ matrix.platform }}"
    needs: gitleaks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Same context and sdk/certs contexts as docker-compose.yml
          context: platform/backend
          file: platform/backend/Dockerfile
          build-contexts: |
            sdk=sdk
            certs=common/certs
          platforms: linux/${{ matrix.platform }}
          push: false
          # Read-only: the cache written by publish-images on devel (same scope
          # as build-image.yml), so a PR only rebuilds the layers it changed
          cache-from: type=gha,scope=backend-${{ matrix.platform }}

  platform-backend-python:
    name: "platform: backend python ${{ matrix.python }}"
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - name: Sync environment
        run: uv sync --frozen
      - name: Type check
        run: uv run --frozen --no-sync mypy app
      - name: Test
        # Fails below fail_under in pyproject.toml on every version
        run: uv run --frozen --no-sync pytest --color=yes --cov --cov-report=xml
      - name: Coverage
        # Report and upload only on 3.12, so the backend reports once per commit
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: ./.github/actions/coverage
        with:
          directory: platform/backend
          flag: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  platform-infrastructure:
    name: "platform: infrastructure"
    needs: gitleaks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: platform/tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --frozen
      - name: Test
        # Integration tests need the running platform. python -m puts the
        # current directory on sys.path, which the tests need to import system/
        run: uv run --frozen --no-sync python -m pytest --color=yes -m "not integration"

  platform-compose:
    name: "platform: compose debug=${{ matrix.debug }} optional=${{ matrix.optional }} system-test=${{ matrix.system-test }}"
    needs: gitleaks
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        debug: ["false", "true"]
        optional: ["false", "true"]
        system-test: ["false", "true"]
    defaults:
      run:
        working-directory: platform
    env:
      DEBUG_AGENTS: ${{ matrix.debug }}
      OPTIONAL_AGENTS: ${{ matrix.optional }}
      SYSTEM_TEST: ${{ matrix.system-test }}
      # Placeholders for the variables .env sets, which init_env.py generates
      # in make up. config only interpolates them
      ADMIN_DB_PASSWORD: placeholder
      AGENT_SECRET: placeholder
      LITELLM_DB_PASSWORD: placeholder
      LITELLM_LOCAL_PORT: "9977"
      LITELLM_MASTER_KEY: placeholder
      LLM_API_KEY: placeholder
      LLM_CONFIG_PROFILE: placeholder
      PROMETHEUS_API_BASE_IMAGE_HASH: placeholder
      REDIS_PASSWORD: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate
        run: make generate
      - name: Validate
        # The same files the Makefile passes, with both profiles so every
        # service is checked. Fails on warnings too, such as an unset variable
        run: |
          files=(-f docker-compose.yml -f docker-compose.agents.yml)
          if [ "$SYSTEM_TEST" = true ]; then
            files+=(-f docker-compose.system-test.yml)
          fi
          docker compose "${files[@]}" --profile dev --profile prod config -q 2> "$RUNNER_TEMP/config.log" \
            || { cat "$RUNNER_TEMP/config.log"; exit 1; }
          if [ -s "$RUNNER_TEMP/config.log" ]; then
            cat "$RUNNER_TEMP/config.log"
            echo "::error::docker compose config printed warnings"
            exit 1
          fi

  agent-template-compose:
    name: "agent-template: compose ${{ matrix.network }}"
    needs: gitleaks
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: internal
          - network: external
            host: localhost
            port: "8042"
    defaults:
      run:
        working-directory: agent-template/agent_template
    env:
      NETWORK: ${{ matrix.network }}
      # Placeholders for the variables .env sets. config only interpolates them
      AGENT_SECRET: placeholder
      LITELLM_MASTER_KEY: placeholder
      REDIS_PASSWORD: placeholder
      # Set together for external mode, as the Makefile requires
      EXTERNAL_AGENT_HOST: ${{ matrix.host }}
      EXTERNAL_AGENT_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate
        # The same files the Makefile passes. Fails on warnings too, such as
        # an unset variable
        run: |
          docker compose -f docker-compose.yml -f "docker-compose.net_$NETWORK.yml" config -q 2> "$RUNNER_TEMP/config.log" \
            || { cat "$RUNNER_TEMP/config.log"; exit 1; }
          if [ -s "$RUNNER_TEMP/config.log" ]; then
            cat "$RUNNER_TEMP/config.log"
            echo "::error::docker compose config printed warnings"
            exit 1
          fi

  # Follows the in-tree deployment path in agent-template/TUTORIAL.md (Step 1,
  # then Step 9): scaffold an agent, uv sync, copy it to platform/agents/, then
  # make generate and make up. Then checks it through the backend. Stub
  # credentials, as in platform: up.
  #
  # Keep in sync with the "In-tree deployment" sections of
  # agent-template/TUTORIAL.md and the scaffolding notes in
  # agent-template/README.md: a change to those steps belongs here too. The
  # steps marked CI only are not part of the documented flow.
  agent-template-platform:
    name: "agent-template: platform"
    needs: [gitleaks, platform-compose, agent-template-scaffold]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    env:
      # CI only: build the prometheus_api base image from ../sdk, so the PR's
      # SDK is tested, instead of pulling the pinned registry image
      LOCAL_SDK: "true"
      # The default agents (client-agent, form-filler, synthesis) start with the
      # scaffolded one. No debug or optional agents, and no frontend
      DEBUG_AGENTS: "false"
      OPTIONAL_AGENTS: "false"
      PROFILE: ""
      # CI only: stub credentials, as in platform: up
      LLM_CONFIG_PROFILE: anthropic
      LLM_API_KEY: sk-ant-test-not-real
      DEEPLYNX_KEY: ci-test-key
      DEEPLYNX_SECRET: ci-test-secret
      DEEPLYNX_ORG_ID: "1"
      DEEPLYNX_PROJECT_ID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Create platform .env
        # Before scaffolding, so setup_agent.py copies the platform's secrets
        # into the agent's .env, as README.md describes
        run: |
          make init-env
          # CI only: once .env exists, make loads it over the environment, and
          # its blank DEEPLYNX_* lines would hide the stubs from every container
          sed -i.bak \
            -e "s|^DEEPLYNX_KEY=.*|DEEPLYNX_KEY=$DEEPLYNX_KEY|" \
            -e "s|^DEEPLYNX_SECRET=.*|DEEPLYNX_SECRET=$DEEPLYNX_SECRET|" \
            -e "s|^DEEPLYNX_ORG_ID=.*|DEEPLYNX_ORG_ID=$DEEPLYNX_ORG_ID|" \
            -e "s|^DEEPLYNX_PROJECT_ID=.*|DEEPLYNX_PROJECT_ID=$DEEPLYNX_PROJECT_ID|" \
            .env
          rm .env.bak
      - name: Scaffold
        # TUTORIAL.md Step 1. The agent registers as ci-check-agent, from the
        # card name "CI Check Agent"
        run: python3 ../agent-template/setup_agent.py --yes "CI Check" "$RUNNER_TEMP/ci-check-agent"
      - name: Sync
        # TUTORIAL.md Step 1. Creates the uv.lock the Dockerfile requires
        working-directory: ${{ runner.temp }}/ci-check-agent
        run: uv sync
      - name: Copy into the platform
        # TUTORIAL.md Step 9, in-tree deployment
        run: |
          cp -R "$RUNNER_TEMP/ci-check-agent" agents/ci-check-agent
          # CI only: the image installs its own dependencies, so keep the
          # venv out of the Docker build context
          rm -rf agents/ci-check-agent/.venv
      - name: Point the agent at the backend registry
        # CI only: the template compose still defaults to LiteLLM, but the
        # platform's registry is the backend, and it checks AGENT_SECRET. The
        # same two lines the platform's own agents have. Remove this step once
        # the template compose has them (open PR #276). The platform's .env and
        # this job's environment fill in the variables, not the agent's .env
        working-directory: platform/agents/ci-check-agent
        run: |
          sed -i \
            -e 's|REGISTRY_URL: .*|REGISTRY_URL: http://backend:8000|' \
            -e "s|LITELLM_MASTER_KEY: .*|LITELLM_MASTER_KEY: \${AGENT_SECRET}|" \
            docker-compose.yml
          grep -n 'REGISTRY_URL\|LITELLM_MASTER_KEY' docker-compose.yml
      - name: Generate
        # TUTORIAL.md Step 9. Lists the agents make up will start
        run: make generate
      - name: Start
        # TUTORIAL.md Step 9. Waits for every healthcheck, then make check
        # waits for every agent, the scaffolded one included, to be registered
        # with the backend
        run: make up
      - name: Check the agent card
        # TUTORIAL.md Step 9, verify registration. What the client-agent would
        # read: the card the scaffolded agent registered, served by the backend
        # gateway. The tutorial's LiteLLM check on port 9977 is what #276 replaces
        run: |
          secret=$(sed -n 's/^AGENT_SECRET=//p' .env)
          echo "::add-mask::$secret"
          curl -fsS -H "Authorization: Bearer $secret" http://localhost:8600/a2a/ci-check-agent > "$RUNNER_TEMP/card.json"
          python3 - "$RUNNER_TEMP/card.json" <<'EOF'
          import json
          import sys

          card = json.load(open(sys.argv[1]))
          skills = [skill["id"] for skill in card["skills"]]
          assert card["name"] == "CI Check Agent", card["name"]
          assert skills == ["ci_check_analysis"], skills
          print(f"{card['name']}: {skills}")
          EOF
      - name: Show status
        if: ${{ failure() }}
        run: docker ps --all
      - name: Collect logs
        if: ${{ failure() }}
        env:
          COMPOSE_PROJECT_NAME: prometheus_platform
          COMPOSE_FILE: docker-compose.yml:docker-compose.agents.yml
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          for service in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$service" > "$RUNNER_TEMP/logs/$service.log"
          done
          docker ps --all > "$RUNNER_TEMP/logs/ps.txt"
          cat "$RUNNER_TEMP/logs"/*.log
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-template-platform-logs
          path: ${{ runner.temp }}/logs/
          retention-days: 14
      - name: Stop
        if: ${{ always() }}
        run: make down-v

  # Runs on every PR, merge queue and devel push like the rest of this
  # workflow: the whole job, build included, takes a few minutes, so nightly
  # would only delay the failures. See platform/tests/README.md for why no
  # real LLM key is needed.
  platform-up:
    name: "platform: up"
    # Skip the slow start when a compose file doesn't even parse
    needs: [gitleaks, platform-compose]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    env:
      # Build the prometheus_api base image from ../sdk instead of pulling it
      LOCAL_SDK: "true"
      DEBUG_AGENTS: "true"
      OPTIONAL_AGENTS: "false"
      PROFILE: prod
      # make up runs init_env.py, which creates .env from .env.example,
      # generates every secret, and takes the profile and its key from the
      # environment. Nothing calls an LLM or DeepLynx at startup, so
      # placeholders are enough.
      LLM_CONFIG_PROFILE: anthropic
      LLM_API_KEY: sk-ant-test-not-real
      DEEPLYNX_KEY: ci-test-key
      DEEPLYNX_SECRET: ci-test-secret
      DEEPLYNX_ORG_ID: "1"
      DEEPLYNX_PROJECT_ID: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Start
        # make up waits for every healthcheck, then runs make check: the
        # backend and frontend on their host ports, the frontend's /api proxy,
        # and every agent registered with LiteLLM
        run: make up
      - name: Sync test environment
        working-directory: platform/tests
        run: uv sync --frozen
      - name: Integration tests
        # Against the stack make up started: the tests find it running and use
        # it, with the credentials and ports in platform/.env
        env:
          UV_FROZEN: "1"
          UV_NO_SYNC: "1"
        run: make test-integration
      - name: Show status
        if: ${{ failure() }}
        run: docker ps --all
      - name: Collect logs
        if: ${{ failure() }}
        # The same files and profile make up used, so the agents are included
        env:
          COMPOSE_PROJECT_NAME: prometheus_platform
          COMPOSE_FILE: docker-compose.yml:docker-compose.agents.yml
        run: |
          export COMPOSE_PROFILES="$PROFILE"
          mkdir -p "$RUNNER_TEMP/logs"
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/logs/all.log"
          for service in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$service" > "$RUNNER_TEMP/logs/$service.log"
          done
          docker ps --all > "$RUNNER_TEMP/logs/ps.txt"
          cat "$RUNNER_TEMP/logs/all.log"
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-up-logs
          path: ${{ runner.temp }}/logs/
          retention-days: 14
      - name: Stop
        if: ${{ always() }}
        run: make down-v

  platform-agent:
    name: "platform: agent ${{ matrix.agent }}"
    needs: gitleaks
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: client-agent
            path: platform/agents/client-agent
            flag: client-agent
          - agent: osti-research-agent
            path: platform/agents/optional/osti-research-agent
            flag: osti-research-agent
            # marker-pdf pulls in PyTorch with CUDA and the tests don't use it
            overrides: "marker-pdf; sys_platform == 'never'"
          - agent: code-render-debug-agent
            path: platform/agents/debug-agents/code-render-debug-agent
            flag: code-render-debug-agent
          - agent: corrosion-agent
            path: platform/agents/debug-agents/corrosion-agent
            flag: corrosion-agent
          - agent: thermal-agent
            path: platform/agents/debug-agents/thermal-agent
            flag: thermal-agent
          - agent: form-filler-agent
            path: platform/agents/form-filler-agent
            flag: form-filler-agent
          - agent: synthesis-agent
            path: platform/agents/synthesis-agent
            flag: synthesis-agent
          - agent: artifact-debug-agent
            path: platform/agents/debug-agents/artifact-debug-agent
            flag: artifact-debug-agent
          - agent: material-data-agent
            path: platform/agents/debug-agents/material-data-agent
            flag: material-data-agent
          - agent: radiation-agent
            path: platform/agents/debug-agents/radiation-agent
            flag: radiation-agent
          - agent: thread-pattern-agent
            path: platform/agents/debug-agents/thread-pattern-agent
            flag: thread-pattern-agent
          - agent: agent-template
            path: agent-template/agent_template
            flag: template-agent
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"
      - name: Install dependencies
        # Like the agent images: prometheus_api first, then the agent's locked
        # dependencies on top. An agent with overrides resolves fresh instead,
        # since its uv.lock doesn't have them
        env:
          OVERRIDES: ${{ matrix.overrides }}
        run: |
          uv venv
          uv pip install pytest pytest-asyncio pytest-cov "$GITHUB_WORKSPACE/sdk"
          if [ -n "$OVERRIDES" ]; then
            printf '%s\n' "$OVERRIDES" > "$RUNNER_TEMP/overrides.txt"
            uv pip install -r pyproject.toml --overrides "$RUNNER_TEMP/overrides.txt"
          else
            uv sync --locked --no-dev --no-install-project --inexact
          fi
      - name: Test
        # Agents with a flag fail below fail_under in their pyproject.toml
        run: .venv/bin/python -m pytest --color=yes ${{ matrix.flag && '--cov --cov-report=xml' || '' }}
      - name: Coverage
        if: ${{ !cancelled() && matrix.flag }}
        uses: ./.github/actions/coverage
        with:
          directory: ${{ matrix.path }}
          flag: ${{ matrix.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
