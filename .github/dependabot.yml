version: 2
updates:
  # Every uv project, one directory per uv.lock. Add a new uv project here when
  # its uv.lock is committed; platform/tests/infrastructure/test_dependabot.py
  # fails if one is missing. Updates go to devel weekly, minor and patch
  # grouped into one PR, major updates one PR each. New releases wait a week
  # before Dependabot proposes them
  - package-ecosystem: uv
    directories:
      - /agent-template
      - /agent-template/agent_template
      - /platform/agents
      - /platform/agents/client-agent
      - /platform/agents/debug-agents/artifact-debug-agent
      - /platform/agents/debug-agents/code-render-debug-agent
      - /platform/agents/debug-agents/corrosion-agent
      - /platform/agents/debug-agents/material-data-agent
      - /platform/agents/debug-agents/radiation-agent
      - /platform/agents/debug-agents/thermal-agent
      - /platform/agents/debug-agents/thread-pattern-agent
      - /platform/agents/form-filler-agent
      - /platform/agents/optional/osti-research-agent
      - /platform/agents/synthesis-agent
      - /platform/backend
      - /platform/ctl
      - /platform/docs
      - /platform/tests
    schedule:
      interval: weekly
    target-branch: devel
    cooldown:
      default-days: 7
    # Raise the lower bounds in pyproject.toml as well as uv.lock
    versioning-strategy: increase
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # platform/backend and platform/tests lock sdk/'s pyproject.toml through
  # their path source, so a change to it would leave their uv.lock stale.
  # Update only sdk/uv.lock and leave its bounds for hand edits
  - package-ecosystem: uv
    directory: /sdk
    schedule:
      interval: weekly
    target-branch: devel
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    groups:
      sdk:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions are pinned by SHA with a version comment, and Dependabot updates
  # both. The composite actions are listed so it reads their uses: too
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    target-branch: devel
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The React frontend. Majors are ignored: they can change how the app builds
  # or renders (Vite, React, the viewers' libraries), so they're upgraded by
  # hand with a check of the app. Security updates still arrive for any version
  - package-ecosystem: npm
    directory: /platform/frontend
    schedule:
      interval: weekly
    target-branch: devel
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images pinned by tag and digest. The agent Dockerfiles build FROM the
  # prometheus_api base image through build args, which Dependabot can't
  # resolve; that hash is bumped by hand in platform/Makefile. Majors are
  # ignored: node's should move with the frontend's node-version in CI
  - package-ecosystem: docker
    directories:
      - /sdk
      - /platform/backend
      - /platform/frontend
    schedule:
      interval: weekly
    target-branch: devel
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ["*"]

  # The platform's service images. Majors are ignored: a postgres major needs
  # a data migration, and litellm and valkey majors need checking by hand
  - package-ecosystem: docker-compose
    directory: /platform
    schedule:
      interval: weekly
    target-branch: devel
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      compose:
        patterns: ["*"]
