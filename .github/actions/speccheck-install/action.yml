name: speccheck install
description: Install the speccheck command from this checkout with uv, and put it on PATH

# For a job that runs speccheck itself, such as `speccheck record` as a job's last step.
# speccheck-verify uses it, so its callers don't need it. Needs a checkout of this repo (with
# `persist-credentials: false`); it installs common/speccheck from there, not from an index.
# It sets up uv only to install the tool, with no cache, and leaves the job's own Python and
# environment alone. See common/speccheck/README.md, "In CI"

inputs:
  python:
    description: The Python version uv installs speccheck with
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.11.25"
        # Nothing here is worth caching, and a cache is one more thing to trust
        enable-cache: false
    - name: Install speccheck
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      # The build backend comes from build-constraints.txt, by hash (uv.lock doesn't cover build
      # requirements): it goes into a throwaway venv with --require-hashes, the wheel is built
      # there without build isolation, so nothing else is fetched to build it, and the tool is
      # installed from that wheel. The PATH entry is uv's tool bin folder, not anything an input
      # controls
      run: | # zizmor: ignore[github-env]
        SRC="$GITHUB_WORKSPACE/common/speccheck"
        BUILD="$RUNNER_TEMP/speccheck-build"
        rm -rf "$BUILD"
        uv venv --quiet --no-config --python "$PYTHON" "$BUILD/venv"
        VIRTUAL_ENV="$BUILD/venv" uv pip install --quiet --no-config --no-cache --require-hashes --no-deps \
          -r "$SRC/build-constraints.txt"
        VIRTUAL_ENV="$BUILD/venv" uv build --quiet --no-config --no-cache --wheel --no-build-isolation \
          --python "$BUILD/venv/bin/python" --out-dir "$BUILD/dist" "$SRC"
        uv tool install --python "$PYTHON" --no-config "$BUILD"/dist/prometheus_speccheck-*.whl
        uv tool dir --bin >> "$GITHUB_PATH"
        "$(uv tool dir --bin)/speccheck" --version
