name: speccheck verify
description: The final job's steps - download the run's speccheck results, publish the report, verify them

# For the last job of a workflow, with `needs:` on every job that uploads results and
# `if: ${{ !cancelled() }}`, so it reports even when a test job failed. The calling job needs
# `contents: read` (download-artifact reads this run's artifacts with the job's own token),
# `actions: read` (to look up the run's job names), and a checkout with
# `persist-credentials: false`; speccheck-install installs speccheck from it. Without
# `actions: read` the lookup warns, and results are named by producer instead.
# The downloaded files are untrusted data: speccheck parses them as JSON with a size limit and
# never opens paths named in them. The report and step summary escape everything taken from
# them, and from the job names. Exits with verify's code.
# See common/speccheck/README.md, "In CI"

inputs:
  config:
    description: The spec folder's config, speccheck.toml or a pyproject.toml, relative to the checkout
    required: true
  complete:
    description: >-
      "true" to also fail on a producer of this workflow that didn't report, and on a requirement
      nothing that reported claims (use it where every producer runs, such as on devel)
    required: false
    default: "false"
  workflow:
    description: With complete, expect the producers that list this workflow (default the workflow's name)
    required: false
    default: ""
  report-name:
    description: Name of the report artifact
    required: false
    default: speccheck-report

outputs:
  summary-path:
    description: >-
      The step summary file the report was appended to. Each step gets its own
      $GITHUB_STEP_SUMMARY, so a later step can't read it through that variable
    value: ${{ steps.verify.outputs.summary-path }}
  report-artifact-id:
    description: The ID of the uploaded report artifact
    value: ${{ steps.upload-report.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - name: Download speccheck results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: speccheck-results-*
        path: ${{ runner.temp }}/speccheck-results
    - name: Install speccheck
      uses: ./.github/actions/speccheck-install
    - name: Look up the run's job names
      # A job can't read its own display name, so the final job looks them all up: job ID to
      # name, for every attempt. A failure only costs the names, so it warns and goes on
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        NAMES: ${{ runner.temp }}/speccheck-job-names.json
      run: |
        if ! gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
            --jq '.jobs[] | {key: (.id | tostring), value: .name}' \
            | jq -s 'from_entries' > "$NAMES"; then
          echo "::warning::speccheck: couldn't look up this run's job names (does the job have actions: read?); results are named by producer"
          rm -f "$NAMES"
        fi
    - name: Report
      # report never fails on the requirements, so the report is published either way
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        COMPLETE: ${{ inputs.complete }}
        WORKFLOW: ${{ inputs.workflow || github.workflow }}
        RESULTS: ${{ runner.temp }}/speccheck-results
        REPORT: ${{ runner.temp }}/speccheck-report/report.md
        JSON: ${{ runner.temp }}/speccheck-report/report.json
        NAMES: ${{ runner.temp }}/speccheck-job-names.json
      run: |
        mkdir -p "$RESULTS" "$(dirname "$REPORT")"
        scope=()
        if [ "$COMPLETE" = "true" ]; then scope=(--complete --workflow "$WORKFLOW"); fi
        names=()
        if [ -s "$NAMES" ]; then names=(--job-names "$NAMES"); fi
        speccheck report --config "$CONFIG" "${scope[@]}" "${names[@]}" "$RESULTS" --output "$REPORT"
        speccheck report --config "$CONFIG" "${scope[@]}" "${names[@]}" "$RESULTS" --json > "$JSON"
    - name: Upload report
      id: upload-report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-name }}
        path: ${{ runner.temp }}/speccheck-report
        # A re-run attempt, or a second verify in one run, replaces the report
        overwrite: true
        if-no-files-found: error
        retention-days: 90
    - name: Verify
      id: verify
      # After the upload, so the step summary can link the report. The summary is the failures only
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        COMPLETE: ${{ inputs.complete }}
        WORKFLOW: ${{ inputs.workflow || github.workflow }}
        RESULTS: ${{ runner.temp }}/speccheck-results
        REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        NAMES: ${{ runner.temp }}/speccheck-job-names.json
      run: |
        echo "summary-path=$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
        scope=()
        if [ "$COMPLETE" = "true" ]; then scope=(--complete --workflow "$WORKFLOW"); fi
        names=()
        if [ -s "$NAMES" ]; then names=(--job-names "$NAMES"); fi
        speccheck verify --config "$CONFIG" "${scope[@]}" "${names[@]}" "$RESULTS" \
          --summary "$GITHUB_STEP_SUMMARY" --report-url "$REPORT_URL"
