# Redocly lint rules for openapi.json, the backend's OpenAPI document, which
# ../scripts/export_openapi.py writes from the app. Run from this directory:
#
#   npm ci && npm run lint
#
# recommended-strict is the recommended ruleset with every warning raised to an
# error, so new warnings fail CI instead of piling up. Turn a rule off below,
# with the reason, rather than lowering its severity.
#
# Problems the document already had when the lint was added are listed in
# .redocly.lint-ignore.yaml, which Redocly reads automatically. Remove entries
# from it as they're fixed

extends:
  - recommended-strict

rules:
  # The backend is self-hosted, so there's no one server URL to list. Clients
  # call the host they loaded the document from
  no-empty-servers: off

  # Replaced by rule/operation-4xx-response below, which makes the same check
  # but skips the routes that can't answer with a 4xx
  operation-4xx-response: off

  # Every operation documents at least one 4xx response, like the built-in rule,
  # except on the routes listed here. Each one either has no input to reject
  # or reports failure with a 5xx:
  #   /healthz, /readyz      health probes; /readyz's failure is a 503
  #   /.well-known/jwks.json public signing keys
  #   /api/setup/status      whether the first admin exists
  #   /api/auth/logout       always 200, even with no or a bad cookie
  #   /api/auth/providers    public list of login options
  # Only add a route here if it can't answer with a 4xx. If it can, document
  # the response with app/api_responses.py
  rule/operation-4xx-response:
    subject:
      type: Responses
    assertions:
      # Every registered 4xx code, and the 4XX range. Redocly can't match keys
      # by pattern here, so they're listed
      requireAny:
        - "4XX"
        - "400"
        - "401"
        - "402"
        - "403"
        - "404"
        - "405"
        - "406"
        - "407"
        - "408"
        - "409"
        - "410"
        - "411"
        - "412"
        - "413"
        - "414"
        - "415"
        - "416"
        - "417"
        - "418"
        - "421"
        - "422"
        - "423"
        - "424"
        - "425"
        - "426"
        - "428"
        - "429"
        - "431"
        - "451"
    where:
      - subject:
          type: PathItem
          filterOutParentKeys:
            - /healthz
            - /readyz
            - /.well-known/jwks.json
            - /api/setup/status
            - /api/auth/logout
            - /api/auth/providers
        assertions:
          defined: true
    message: Operation must have at least one `4XX` response.
    severity: error
