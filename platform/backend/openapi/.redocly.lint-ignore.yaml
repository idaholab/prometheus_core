# The lint problems openapi.json had when the lint, or one of its rules, was
# added, ignored so CI passes while they're fixed. Each entry ignores one rule
# at one location, so a new route or schema with the same problem still fails.
#
# Remove an entry when you fix its problem, or the whole file once they're all
# fixed. Don't add to it: fix a new problem, or turn its rule off in
# redocly.yaml with the reason. The one exception is a rule newly added to
# redocly.yaml, whose existing problems go here so it checks new routes right
