[project]
name = "backend"
version = "0.1.0"
description = "Standalone FastAPI backend (replaces Chainlit's server role)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # required for form-encoded POST /api/auth/login
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.0",
    "redis>=4.2",
    "httpx>=0.27.0",
    "pyjwt>=2.8",
    "pyyaml>=6.0.3",
    # Exodus/STL → VTP conversion for the MeshViewer (app/services/mesh/*). Headless
    # IO + filters only (no offscreen GL), but `import vtk` still links libGL, so the
    # image installs the GL/X client libs (see Dockerfile).
    "vtk>=9.3",
    # Admin plane: local users, OIDC provider config, RS256 signing keys
    # (app/db.py, app/db/models.py, app/routers/admin_*.py, app/routers/setup.py).
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "bcrypt>=4.0",
    # Encrypts OIDC client secrets + private signing keys at rest in admin-db
    # (Fernet, app/crypto.py). Also used by prometheus_api for RS256 -- pinning
    # here too since the backend depends on it directly, not just transitively.
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12.20250915",
    # Local dev/tests import prometheus_api.contract; in Docker the package is
    # installed from the repo's sdk/ by the Dockerfile (--no-dev skips this entry
    # at image build time).
    "prometheus-api",
    # In-memory async DB for admin-plane tests (app/db.py, tests/conftest.py) --
    # tests never touch real Postgres; only Alembic/production use asyncpg.
    "aiosqlite>=0.20",
    # In-memory Valkey/Redis for the session store, the SSE event bus and session
    # revocation (tests/conftest.py's `fake_redis`). Implements everything those use,
    # pub/sub and PUBSUB NUMSUB included, so none of it needs a live container.
    "fakeredis>=2.38",
]

[tool.uv.sources]
# NOTE: the container installs prometheus_api from the checked-out sdk/, not from
# this pin, so local tests can run against a different prometheus_api than the
# image does. Keep this rev reasonably current with sdk/.
# Working on prometheus_api locally? Override with:
#   uv pip install -e /path/to/prometheus_api
prometheus-api = { git = "https://github.inl.gov/genesis/prometheus_api.git", rev = "1914b557818cd6a9c558280c5789d7a67b8a0717" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
lint.select = ["E", "F"]
lint.ignore = ["E501"]
lint.per-file-ignores = { "tests/*" = ["E402"] }
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
line-length = 120
target-version = "py312"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
