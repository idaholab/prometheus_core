services:
  osti-research-agent:
    build:
      context: .
      args:
        - PROMETHEUS_API_BASE_IMAGE_REPO=${PROMETHEUS_API_BASE_IMAGE_REPO:-containers.github.inl.gov/genesis/prometheus_api}
        - PROMETHEUS_API_BASE_IMAGE_HASH=${PROMETHEUS_API_BASE_IMAGE_HASH}
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: osti-research-agent
    extra_hosts:
      - "prometheus.host.internal:host-gateway"
    networks:
      - agent-network
    environment:
      AGENT_PORT: 8000
      EXTERNAL_AGENT_URL: http://osti-research-agent:8000
      AGENT_SECRET: ${AGENT_SECRET}
      REGISTRY_URL: ${REGISTRY_URL:-http://backend:8000}
      LLM_CONFIG_PROFILE: ${LLM_CONFIG_PROFILE:?set LLM_CONFIG_PROFILE in .env}
      LLM_CONFIG_FILE: ${LLM_CONFIG_FILE:-}
      # The SDK sends this as its registry token; the backend registry checks AGENT_SECRET.
      LITELLM_MASTER_KEY: ${AGENT_SECRET}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
      # Multi-user identity plane (RS256 only): this agent verifies with the
      # public key or JWKS_URL -- it never holds the private key. JWKS_URL
      # defaults to the backend's own endpoint, reachable by container name on
      # this network, so an admin-generated/rotated signing key (Admin >
      # Signing Keys) verifies with no USER_IDENTITY_PUBLIC_KEY at all. See
      # docs/dev-docs/multi-user-setup.md.
      JWKS_URL: ${JWKS_URL:-http://backend:8000/.well-known/jwks.json}
      USER_IDENTITY_PUBLIC_KEY: ${USER_IDENTITY_PUBLIC_KEY:-}
      USER_IDENTITY_ISS: ${USER_IDENTITY_ISS:-prometheus-platform}
      USER_IDENTITY_AUD: ${USER_IDENTITY_AUD:-prometheus-agents}
      USER_IDENTITY_REQUIRED: ${USER_IDENTITY_REQUIRED:-true}
      CREDENTIAL_BROKER: ${CREDENTIAL_BROKER:-env}
      DEEPLYNX_BASE_URL: ${DEEPLYNX_BASE_URL:-https://deeplynx.inl.gov/api/v1}
      DEEPLYNX_KEY: ${DEEPLYNX_KEY:-}
      DEEPLYNX_SECRET: ${DEEPLYNX_SECRET:-}
      DEEPLYNX_JWT_TOKEN: ${DEEPLYNX_JWT_TOKEN:-}
      DEEPLYNX_ORG_ID: ${DEEPLYNX_ORG_ID:-}
      DEEPLYNX_PROJECT_ID: ${DEEPLYNX_PROJECT_ID:-}
      DEEPLYNX_DATA_SOURCE_ID: ${DEEPLYNX_DATA_SOURCE_ID:-}
      TOTAL_BUDGET_S: ${TOTAL_BUDGET_S:-900}
      MAX_PAPERS_ANALYZED: ${MAX_PAPERS_ANALYZED:-5}
      MAX_OSTI_SEARCHES: ${MAX_OSTI_SEARCHES:-5}
      MAX_SCHOLARLY_SEARCHES: ${MAX_SCHOLARLY_SEARCHES:-4}
      ANALYZER_MODEL_CALL_LIMIT: ${ANALYZER_MODEL_CALL_LIMIT:-8}
      ANALYZER_TOOL_CALL_LIMIT: ${ANALYZER_TOOL_CALL_LIMIT:-12}
      VERIFIER_MODEL_CALL_LIMIT: ${VERIFIER_MODEL_CALL_LIMIT:-10}
      VERIFIER_TOOL_CALL_LIMIT: ${VERIFIER_TOOL_CALL_LIMIT:-12}
      MAX_PDF_MB: ${MAX_PDF_MB:-50}
      # Comma-separated hosts PDFs may be downloaded from; empty = built-in list.
      DOWNLOAD_ALLOWED_DOMAINS: ${DOWNLOAD_ALLOWED_DOMAINS:-}
      DOCLING_TIMEOUT_S: ${DOCLING_TIMEOUT_S:-240}
      DOCLING_IMAGES_SCALE: ${DOCLING_IMAGES_SCALE:-2.0}
      DOCLING_TABLE_MODE: ${DOCLING_TABLE_MODE:-accurate}
      PARSE_OCR: ${PARSE_OCR:-auto}
      ANALYZE_FIGURES: ${ANALYZE_FIGURES:-false}
      MAX_FIGURES: ${MAX_FIGURES:-12}
      MIN_FIGURE_AREA: ${MIN_FIGURE_AREA:-10000}
      # Web search is additive. OpenAlex and arXiv remain available without keys.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-none}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      SCHOLARLY_ARXIV: ${SCHOLARLY_ARXIV:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding}
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - osti-model-cache:/root/.cache/datalab
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
    # /healthz is served by the PrometheusAgent base class once uvicorn is up.
    # It does not cover registry registration, which retries in the background.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  osti-model-cache:
  huggingface-cache:
  torch-cache:
