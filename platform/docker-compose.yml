# Prometheus Platform - Core Infrastructure
# Infrastructure, frontend, and client-agent only.
# Specialist agents are included via docker-compose.agents.yml (generated by make).

x-common-env: &common-env
  AGENT_SECRET: ${AGENT_SECRET}
  AGENT_SECRET_REQUIRED: ${AGENT_SECRET_REQUIRED:-true}
  # The A2A agent registry and gateway (backend/app/routers/agent_registry.py).
  REGISTRY_URL: ${REGISTRY_URL:-http://backend:8000}
  # The SDK sends LITELLM_MASTER_KEY as its registry token; the registry checks AGENT_SECRET.
  LITELLM_MASTER_KEY: ${AGENT_SECRET}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  DEEPLYNX_BASE_URL: ${DEEPLYNX_BASE_URL:-https://deeplynx.inl.gov/api/v1}
  DEEPLYNX_KEY: ${DEEPLYNX_KEY:-}
  DEEPLYNX_SECRET: ${DEEPLYNX_SECRET:-}
  DEEPLYNX_JWT_TOKEN: ${DEEPLYNX_JWT_TOKEN:-}
  DEEPLYNX_ORG_ID: ${DEEPLYNX_ORG_ID:-}
  DEEPLYNX_PROJECT_ID: ${DEEPLYNX_PROJECT_ID:-}
  DEEPLYNX_DATA_SOURCE_ID: ${DEEPLYNX_DATA_SOURCE_ID:-}
  PROMETHEUS_MAX_UPLOAD_BYTES: ${PROMETHEUS_MAX_UPLOAD_BYTES:-104857600}
  # Multi-user identity plane (RS256 only -- see docs/dev-docs/multi-user-setup.md
  # and prometheus_api/docs/agent/IDENTITY_KEY_MANAGEMENT.md). Only the backend
  # mints (USER_IDENTITY_PRIVATE_KEY, set on the backend service below only);
  # every service here just verifies, so only the public key belongs in this
  # shared anchor. Generate a keypair with `prometheus-identity-keygen`.
  #
  # JWKS_URL defaults to the backend's own JWKS endpoint (reachable by every
  # service on this network via its container name) -- this is what makes an
  # admin-generated/rotated signing key (Admin > Signing Keys) verifiable
  # without ever setting USER_IDENTITY_PUBLIC_KEY at all. Override only for an
  # agent running outside this docker network (see .env.example).
  JWKS_URL: ${JWKS_URL:-http://backend:8000/.well-known/jwks.json}
  USER_IDENTITY_PUBLIC_KEY: ${USER_IDENTITY_PUBLIC_KEY:-}
  USER_IDENTITY_ISS: ${USER_IDENTITY_ISS:-prometheus-platform}
  USER_IDENTITY_AUD: ${USER_IDENTITY_AUD:-prometheus-agents}
  USER_IDENTITY_REQUIRED: ${USER_IDENTITY_REQUIRED:-true}
  # Multi-user credential plane: per-user JIT credentials for third-party
  # resources (DeepLynx, SLURM). "env" (default) preserves today's global
  # credential behavior; "vault" activates per-user Vault policies.
  CREDENTIAL_BROKER: ${CREDENTIAL_BROKER:-env}

# Containers reach services on the Docker host (e.g. a local DeepLynx) as
# prometheus.host.internal. A name of our own, rather than host.docker.internal,
# works the same on Docker Desktop (which predefines host.docker.internal and
# rejects re-adding it) and on Linux Engine (which does not define it).
x-host-gateway: &host-gateway
  - "prometheus.host.internal:host-gateway"

x-build-args: &prometheus-api-build-args
  PROMETHEUS_API_BASE_IMAGE_REPO: ${PROMETHEUS_API_BASE_IMAGE_REPO:-containers.github.inl.gov/genesis/prometheus_api}
  PROMETHEUS_API_BASE_IMAGE_HASH: ${PROMETHEUS_API_BASE_IMAGE_HASH:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}

networks:
  agent-network:
    driver: bridge

volumes:
  valkey-data:
  admin-db-data:
  # Converted Exodus/STL -> VTP datasets, content-hash keyed. Not a cache of
  # convenience: without a volume it lands in the container's /tmp and every
  # backend restart silently re-converts every mesh a user reopens.
  mesh-cache:

services:

  # PostgreSQL — persistent store for the backend's admin plane (local users,
  # OIDC provider config, RS256 signing keys).
  admin-db:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: admin-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD}
      POSTGRES_DB: admin
    volumes:
      - admin-db-data:/var/lib/postgresql/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Valkey for Redis-compatible shared state (conversations, status, artifacts).
  # The service name stays "redis" so existing REDIS_URL values keep working.
  redis:
    image: valkey/valkey-bundle:9.1.3@sha256:dd30c59c2b2a598e83308095220a31d6d93d64c40a839c702cb1e98c8e220660
    container_name: agent-valkey
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_LOCAL_PORT:-6379}:6379"
    networks:
      - agent-network
    volumes:
      - valkey-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # Client agent - orchestrates the workflow using LangGraph + Claude
  client-agent:
    build:
      context: ./agents/client-agent
      args:
        <<: *prometheus-api-build-args
    container_name: client-agent
    extra_hosts: *host-gateway
    networks:
      - agent-network
    environment:
      <<: *common-env
      AGENT_PORT: 8000
      EXTERNAL_AGENT_URL: http://client-agent:8000
      LLM_CONFIG_PROFILE: ${LLM_CONFIG_PROFILE:?set LLM_CONFIG_PROFILE in .env}
      LLM_CONFIG_FILE: ${LLM_CONFIG_FILE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started
    # /healthz is served by the PrometheusAgent base class once uvicorn is up.
    # It does not cover registry registration, which retries in the background.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Standalone FastAPI backend (replaces Chainlit's server role; see backend/).
  # The React frontend now lives in frontend/ (built by the frontend-dev /
  # frontend-prod services below); the old Chainlit frontend has been removed.
  backend:
    build:
      context: ./backend
      # Built from the checked-out SDK, not the prometheus_api base image.
      additional_contexts:
        sdk: ../sdk
        certs: ../common/certs
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: backend
    extra_hosts: *host-gateway
    ports:
      # Keep the default in sync with BACKEND_PORT in the Makefile (make check)
      - "${BACKEND_PORT:-8600}:8000"
    networks:
      - agent-network
    environment:
      <<: *common-env
      CLIENT_AGENT_URL: ${CLIENT_AGENT_URL:-http://client-agent:8000}
      # Session-cookie signing secret. Must be forwarded into the container and
      # non-empty or the backend refuses to start (backend/app/main.py).
      # Distinct from the USER_IDENTITY_* vars below -- this signs the browser
      # session cookie, not the platform identity JWT agents verify.
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-}
      # Multi-user identity plane: only the backend mints, so only the backend
      # gets the private key. USER_IDENTITY_TTL (minted-token lifetime) is
      # likewise a minting-only concern -- agents never need it. Once an admin
      # generates a key through the admin UI, the DB-stored key takes
      # precedence over this env var -- see backend/app/identity.py.
      USER_IDENTITY_PRIVATE_KEY: ${USER_IDENTITY_PRIVATE_KEY:-}
      USER_IDENTITY_TTL: ${USER_IDENTITY_TTL:-7200}
      # Admin plane (local users, OIDC provider config, signing keys) --
      # backend-only, never forwarded to agents.
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql+asyncpg://admin:${ADMIN_DB_PASSWORD}@admin-db:5432/admin}
      ADMIN_DB_ENCRYPTION_KEY: ${ADMIN_DB_ENCRYPTION_KEY:-}
      # Base URL for the OIDC redirect_uri sent to identity providers -- must
      # be the origin the BROWSER actually uses (e.g. the Vite dev server at
      # http://localhost:5150, which proxies /api here; not this container's
      # own internal host:port). Required once any OIDC provider is
      # configured -- must exactly match that provider's registered redirect
      # URI. See .env.example and docs/dev-docs/multi-user-setup.md.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      # Mesh (Exodus/STL -> VTP) conversion. The cache must sit on the named
      # volume mounted below, not in the container's /tmp. PROMETHEUS_MESH_WORKERS
      # is the VTK subprocess-pool size *per web worker*: with BACKEND_WORKERS=N
      # the peak child count is N x this, which is what BACKEND_MEM_LIMIT has to
      # cover. See backend/app/services/mesh/service.py.
      PROMETHEUS_MESH_CACHE_DIR: /cache/prometheus-mesh
      PROMETHEUS_MESH_WORKERS: ${PROMETHEUS_MESH_WORKERS:-2}
      PROMETHEUS_MESH_TIMEOUT_SECONDS: ${PROMETHEUS_MESH_TIMEOUT_SECONDS:-120}
      # uvicorn worker count (backend/docker-entrypoint.sh). >1 is valid now --
      # session state, the SSE event bus and session revocation all live in Valkey,
      # and migrations run once from the entrypoint rather than once per worker --
      # but the default stays 1: raising it is a deliberate operational decision,
      # and it multiplies the VTK child count above.
      BACKEND_WORKERS: ${BACKEND_WORKERS:-1}
    volumes:
      - mesh-cache:/cache/prometheus-mesh
    # VTK conversion happens in child processes inside this container, so their
    # memory counts against this cgroup. The limit is what turns "a pathological
    # mesh ate the host" into one OOM-killed child that degrades a single
    # artifact (BrokenProcessPool, handled in mesh/service.py).
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}
    # Without this, `restart: unless-stopped` silently papers over a backend that
    # boots but cannot serve -- the container shows "Up" either way.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Not client-agent: the backend only calls it per request, and every agent
    # (client-agent included) waits on the backend, which hosts their registry.
    depends_on:
      redis:
        condition: service_started
      admin-db:
        condition: service_healthy
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
      additional_contexts:
        certs: ../common/certs
    container_name: frontend-dev
    extra_hosts: *host-gateway
    ports:
      # Keep the default in sync with FRONTEND_DEV_PORT in the Makefile (make check)
      - "${FRONTEND_DEV_PORT:-5150}:5150"
    networks:
      - agent-network
    environment:
      # backend is a sibling container on agent-network. Proxy /api to it by
      # service name + internal port (8000), NOT the host-mapped 8600 — inside this
      # container localhost:8600 is its own loopback and refuses the connection.
      VITE_BACKEND_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Wait for a healthy backend: the first /api calls fail until it serves.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      additional_contexts:
        certs: ../common/certs
    container_name: frontend-prod
    extra_hosts: *host-gateway
    ports:
      # Keep the default in sync with FRONTEND_PROD_PORT in the Makefile (make check)
      - "${FRONTEND_PROD_PORT:-8080}:8080"
    networks:
      - agent-network
    depends_on:
      backend:
        condition: service_healthy
    # Probes nginx's own /healthz, not /api/, so a slow backend doesn't mark the
    # frontend unhealthy. nginx:alpine ships busybox wget, not python.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
