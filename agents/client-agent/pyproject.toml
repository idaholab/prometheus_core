[project]
name = "client-agent"
version = "0.1.0"
description = "LangGraph orchestrator for multi-agent nuclear analysis workflows"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.5.3",
    "httpx>=0.26.0",
    "redis>=5.0.1",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*", "workflow_library*"]
